<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automath - Math Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .options {
            margin-bottom: 50px;
        }

        .option-group {
            margin-bottom: 40px;
        }

        .option-group label {
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button.secondary {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        button.selected {
            background: #000000;
            color: #ffffff;
        }

        #restartBtn {
            background: #2563eb;
        }

        #restartBtn:hover {
            background: #1d4ed8;
            opacity: 1;
        }

        .problem-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px 0;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .problem {
            font-size: 72px;
            font-weight: 300;
            line-height: 1.2;
            width: 100%;
            position: relative;
        }

        .problem-line-1 {
            text-align: right;
            padding-right: 60px;
        }

        .problem-line-2 {
            text-align: right;
            padding-right: 60px;
            position: relative;
        }

        .problem-operator {
            position: absolute;
            left: 0;
            width: 50px;
            text-align: left;
        }


        .input-container {
            width: 100%;
        }

        input[type="number"] {
            font-size: 72px;
            padding: 15px 20px;
            padding-right: 60px;
            border: none;
            border-top: 3px solid #000000;
            border-radius: 0;
            width: 100%;
            text-align: right;
            font-family: inherit;
            transition: background-color 0.2s, border-color 0.2s;
            box-sizing: border-box;
            background-color: #f5f5f5;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Hide the browser's up/down spinner arrows on the answer field */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            outline: none;
            border-top-color: #000000;
        }

        input[type="number"].correct {
            background-color: #e8f5e9;
            border-top-color: #22c55e;
            color: #22c55e;
            caret-color: transparent;
        }

        input[type="number"].incorrect {
            background-color: #ffebee;
            border-top-color: #ef4444;
            color: #ef4444;
            caret-color: transparent;
        }

        input[type="number"]::placeholder {
            font-size: 72px;
            color: #cccccc;
        }

        input[type="number"].correct::placeholder {
            color: #22c55e;
        }

        input[type="number"].incorrect::placeholder {
            color: #ef4444;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        .results {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .result-item {
            margin: 0;
        }

        .result-value {
            font-size: 56px;
            font-weight: 300;
            margin-top: 10px;
        }

        .result-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-section {
            margin-top: 40px;
            padding-top: 0;
        }

        .review-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 24px;
            color: #333333;
        }

        .review-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: 400;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .review-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .review-table tr.correct {
            background-color: #ffffff;
        }

        .review-table tr.incorrect {
            background-color: #ffebee;
            color: #ef4444;
        }

        .review-table .problem-col {
            text-align: left;
            padding-left: 20px;
        }

        .review-table .feedback-icon {
            font-size: 20px;
            color: #22c55e;
        }

        .review-table .feedback-icon.incorrect {
            color: #ef4444;
        }

        .hidden {
            display: none;
        }

        .part-left {
            font-size: 18px;
            color: #666666;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .summary-table {
            margin-top: 30px;
        }

        .summary-table tr.current {
            font-weight: 500;
        }

        /* Each number on a score screen has its own color, so the three values
           read apart at a glance. The same colors mark the summary columns. */
        .result-item.score .result-value, .summary-table td.score { color: #2563eb; }
        .result-item.accuracy .result-value, .summary-table td.accuracy { color: #0f766e; }
        .result-item.time .result-value, .summary-table td.time { color: #7c3aed; }
        .result-item.score .result-label { color: #2563eb; }
        .result-item.accuracy .result-label { color: #0f766e; }
        .result-item.time .result-label { color: #7c3aed; }
        .result-item .result-label { font-weight: 600; }

        /* The one way forward between exercises: big, colored and right under
           the title, so nobody has to hunt for it. */
        #nextPartBtn {
            display: block;
            margin: 32px auto 8px auto;
            background: #2563eb;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            padding: 22px 56px;
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        #nextPartBtn:hover {
            background: #1d4ed8;
            opacity: 1;
        }

        #nextPartBtn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #nextPartBtn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .next-hint {
            font-size: 14px;
            color: #737373;
            margin-bottom: 10px;
        }

        /* Fireworks over a score above 85% (Decision 17). Clicks pass through. */
        #fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Automath</h1>

            <div class="options">
                <div class="option-group">
                    <label>Operation</label>
                    <div class="button-group">
                        <button class="secondary operation-btn" data-operation="addition">Addition</button>
                        <button class="secondary operation-btn" data-operation="subtraction">Subtraction</button>
                        <button class="secondary operation-btn" data-operation="multiplication">Multiplication</button>
                        <button class="secondary operation-btn" data-operation="division">Division</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practiceScreen" class="screen">
            <div class="problem-container">
                <div class="problem">
                    <div class="problem-line-1" id="problemNum1"></div>
                    <div class="problem-line-2">
                        <span class="problem-operator" id="problemOp"></span>
                        <span id="problemNum2"></span>
                    </div>
                </div>
                <div class="input-container">
                    <input type="number" id="answer" placeholder="?" autocomplete="off">
                </div>
            </div>

            <div class="progress" id="progress">Problem 1 of 15</div>
        </div>

        <!-- Between parts (only when Compass chose the operations) -->
        <div id="partScreen" class="screen">
            <h2 id="partDoneTitle">Done</h2>
            <div class="results" id="partScore"></div>
            <button id="nextPartBtn">Next</button>
            <div class="next-hint">or press Enter</div>
            <div class="part-left" id="partLeft"></div>
            <div class="review-section">
                <div class="review-title">Review Your Work</div>
                <table class="review-table">
                    <thead>
                        <tr>
                            <th class="problem-col">Problem</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                        </tr>
                    </thead>
                    <tbody id="partReviewBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <h2 id="resultsTitle">Complete</h2>

            <div class="results" id="resultsScore">
                <div class="result-item score">
                    <div class="result-label">Score</div>
                    <div class="result-value" id="scoreResult">0/10</div>
                </div>

                <div class="result-item accuracy">
                    <div class="result-label">Accuracy</div>
                    <div class="result-value" id="accuracyResult">0%</div>
                </div>

                <div class="result-item time">
                    <div class="result-label">Time</div>
                    <div class="result-value" id="timeResult">0:00</div>
                </div>
            </div>

            <!-- Compass runs: one row per operation in this visit -->
            <table class="review-table summary-table hidden" id="summaryTable">
                <thead>
                    <tr>
                        <th class="problem-col">Exercise</th>
                        <th>Score</th>
                        <th>Accuracy</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
            </table>

            <button id="restartBtn" style="margin-top: 40px; margin-bottom: 0;">Practice Again</button>

            <div class="review-section">
                <div class="review-title">Review Your Work</div>
                <table class="review-table" id="reviewTable">
                    <thead>
                        <tr>
                            <th class="problem-col">Problem</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <canvas id="fireworks" hidden></canvas>

    <script>
        // Compass support (app contract 0.1): `compass_parts` in the URL lists the
        // operations to run, with no picker; each finished operation is reported
        // in a data-compass-report block; the results screen comes after the last
        // one. On alternate days the operations are interleaved in one set
        // (`runMode` below). Without the parameter the app works exactly as before.
        const APP_VERSION = '1.4.0';
        const OPERATIONS = ['addition', 'subtraction', 'multiplication', 'division'];
        const OPERATION_NAMES = { addition: 'Addition', subtraction: 'Subtraction', multiplication: 'Multiplication', division: 'Division' };
        const compassParts = (() => {
            try {
                const value = new URLSearchParams(window.location.search).get('compass_parts');
                if (!value) return null;
                const parts = [...new Set(value.split(',').map(p => p.trim().toLowerCase()).filter(p => OPERATIONS.includes(p)))];
                return parts.length > 0 ? parts : null;
            } catch (e) {
                return null;
            }
        })();
        // How a Compass run of two or more operations is laid out: `grouped` runs
        // them one after another (15 problems each); `mixed` interleaves them in
        // one set (15 of each, every operation once per round in a random order,
        // never the same operation twice in a row). The two alternate by the
        // learner's local day: even days mixed, odd days grouped. `mode=mixed` or
        // `mode=grouped` in the URL forces one (for testing).
        const runMode = (() => {
            if (!compassParts || compassParts.length < 2) return 'grouped';
            try {
                const forced = new URLSearchParams(window.location.search).get('mode');
                if (forced === 'mixed' || forced === 'grouped') return forced;
            } catch (e) { /* fall through to the day rule */ }
            const now = new Date();
            const localDay = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
            return localDay % 2 === 0 ? 'mixed' : 'grouped';
        })();
        let partIndex = 0;
        let runParts = []; // one score per finished operation in this visit
        let problemShownAt = null;
        let mixedQueue = null; // mixed runs: the operation of each problem, in order
        let opState = {};      // mixed runs: each operation's own difficulty, streak and trivial counts

        // State
        let selectedOperation = null;
        let currentProblem = 0;
        let totalProblems = 15;
        let correctAnswers = 0;
        let startTime = null;
        let currentDifficulty = 1; // Start at easiest level (1-4)
        let currentProblemData = null;
        let correctStreak = 0; // Track consecutive correct answers
        let droppedFrom = []; // Levels the learner slipped out of this exercise

        // Problem tracking to prevent duplicates and manage trivial problems
        let sessionProblems = []; // All problems shown this session
        let consecutiveTrivialCount = 0; // Consecutive trivial problems
        let totalTrivialCount = 0; // Total trivial problems in session
        let recentOperands = []; // Track last 2 operands used
        let sessionHistory = []; // Track all problems and answers for review

        // Elements
        const startScreen = document.getElementById('startScreen');
        const practiceScreen = document.getElementById('practiceScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const restartBtn = document.getElementById('restartBtn');
        const problemNum1El = document.getElementById('problemNum1');
        const problemNum2El = document.getElementById('problemNum2');
        const problemOpEl = document.getElementById('problemOp');
        const answerInput = document.getElementById('answer');
        const progressEl = document.getElementById('progress');

        // Operation buttons - start practice immediately when clicked
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedOperation = btn.dataset.operation;
                startPractice();
            });
        });

        restartBtn.addEventListener('click', resetApp);

        const partScreen = document.getElementById('partScreen');
        const nextPartBtn = document.getElementById('nextPartBtn');
        nextPartBtn.addEventListener('click', startNextPart);

        // Helper function: Check if problem is trivial
        function isTrivial(num1, num2, operation) {
            if (operation === 'multiplication') return num2 === 0 || num2 === 1;
            if (operation === 'division') return num2 === 1;
            if (operation === 'addition') return num2 === 0;
            if (operation === 'subtraction') return num2 === 0;
            return false;
        }

        // Helper function: Normalize problem for duplicate checking
        // For commutative operations (addition, multiplication), order doesn't matter
        function normalizeProblem(num1, num2, operator) {
            if (operator === '+' || operator === '×') {
                // Commutative: treat (7,2) and (2,7) as same
                return `${Math.min(num1, num2)},${Math.max(num1, num2)},${operator}`;
            }
            // Non-commutative: (7,2) and (2,7) are different
            return `${num1},${num2},${operator}`;
        }

        // Helper function: Check if problem is duplicate
        function isDuplicate(num1, num2, operator) {
            const normalized = normalizeProblem(num1, num2, operator);
            return sessionProblems.includes(normalized);
        }

        // Helper function: Check if operand was used in last 2 problems
        function hasRecentOperand(num1, num2) {
            return recentOperands.includes(num1) || recentOperands.includes(num2);
        }

        // Every problem a level can give, listed once. Picking from the list
        // (rather than drawing at random and retrying) means a session never
        // repeats a problem while an unused one is left anywhere in reach.
        const poolCache = {};
        function problemsAt(operation, level) {
            const key = `${operation}${level}`;
            if (poolCache[key]) return poolCache[key];
            const list = [];
            const add = (num1, num2, operator, answer) => list.push({ num1, num2, operator, answer });
            const pairs = (aFrom, aTo, bFrom, bTo, make) => {
                for (let a = aFrom; a <= aTo; a++) {
                    for (let b = bFrom; b <= (typeof bTo === 'function' ? bTo(a) : bTo); b++) {
                        make(a, b);
                    }
                }
            };
            switch (operation) {
                case 'addition': {
                    const plus = (a, b) => add(a, b, '+', a + b);
                    if (level === 1) pairs(1, 4, 1, a => 5 - a, plus);        // facts within 5
                    else if (level === 2) pairs(1, 9, 1, a => 10 - a, plus);  // facts within 10
                    else if (level === 3) pairs(5, 19, 1, 10, plus);          // facts within 20
                    else pairs(10, 49, 5, 34, plus);                          // two-digit, within 75
                    break;
                }
                case 'subtraction': {
                    const minus = (a, b) => add(a, b, '−', a - b);
                    if (level === 1) pairs(2, 5, 1, a => a - 1, minus);                     // within 5
                    else if (level === 2) pairs(3, 10, 1, a => a - 1, minus);               // within 10
                    else if (level === 3) pairs(6, 20, 1, a => Math.min(10, a - 1), minus); // within 20
                    else pairs(20, 69, 5, 34, minus);                                       // two-digit
                    break;
                }
                case 'multiplication': {
                    const times = (a, b) => add(a, b, '×', a * b);
                    const [aTo, bTo] = [[10, 2], [10, 5], [10, 10], [12, 12]][level - 1];
                    pairs(1, aTo, 0, bTo, times);
                    break;
                }
                case 'division': {
                    const over = (b, q) => add(b * q, b, '÷', q);
                    const [bFrom, bTo, qTo] = [[1, 2, 10], [1, 5, 10], [2, 10, 12], [2, 12, 12]][level - 1];
                    pairs(bFrom, bTo, 1, qTo, over);
                    break;
                }
            }
            poolCache[key] = list;
            return list;
        }

        // The next problem: never one already seen this session (7 × 2 and
        // 2 × 7 count as the same). Among unseen problems at the learner's
        // level, prefer one that keeps the soft rules (no back-to-back trivial
        // problems, at most 3 trivial ones, no number from the last two
        // problems). If every problem at this level has been seen, take an
        // unseen one from the nearest level (one up first, then one down).
        function pickProblem(operation, level) {
            const order = [level, level + 1, level - 1, level + 2, level - 2, level + 3, level - 3]
                .filter(l => l >= 1 && l <= 4);
            for (const l of order) {
                const unseen = problemsAt(operation, l).filter(p => !isDuplicate(p.num1, p.num2, p.operator));
                if (unseen.length === 0) continue;
                let best = [];
                let bestCost = Infinity;
                unseen.forEach(p => {
                    const trivial = isTrivial(p.num1, p.num2, operation);
                    const cost = (trivial && (consecutiveTrivialCount >= 1 || totalTrivialCount >= 3) ? 2 : 0)
                        + (hasRecentOperand(p.num1, p.num2) ? 1 : 0);
                    if (cost < bestCost) {
                        bestCost = cost;
                        best = [];
                    }
                    if (cost === bestCost) best.push(p);
                });
                return best[Math.floor(Math.random() * best.length)];
            }
            // Every problem of this operation has been seen (cannot happen in
            // 15 problems, but never get stuck): repeat one at this level.
            const pool = problemsAt(operation, level);
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function startPractice() {
            currentProblem = 0;
            correctAnswers = 0;
            currentDifficulty = 1; // Start at easiest level
            correctStreak = 0;
            droppedFrom = [];

            // Reset problem tracking
            sessionProblems = [];
            consecutiveTrivialCount = 0;
            totalTrivialCount = 0;
            recentOperands = [];
            sessionHistory = [];

            startScreen.classList.remove('active');
            practiceScreen.classList.add('active');

            startTime = Date.now();
            showNextProblem();
        }

        // Mixed runs: 15 rounds, each with every operation once in a random
        // order, and never the same operation twice in a row across rounds.
        function buildMixedQueue(parts) {
            const queue = [];
            for (let round = 0; round < totalProblems; round++) {
                let order;
                do {
                    order = [...parts];
                    for (let i = order.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [order[i], order[j]] = [order[j], order[i]];
                    }
                } while (queue.length > 0 && order[0] === queue[queue.length - 1]);
                queue.push(...order);
            }
            return queue;
        }

        // Mixed runs: one set of every listed operation, interleaved. Each
        // operation keeps its own difficulty level and streak, as it would on
        // its own.
        function startMixedPractice() {
            mixedQueue = buildMixedQueue(compassParts);
            opState = {};
            compassParts.forEach(op => {
                opState[op] = { difficulty: 1, streak: 0, droppedFrom: [], consecutiveTrivial: 0, totalTrivial: 0, recentOperands: [], answered: 0, correct: 0, ms: 0 };
            });
            currentProblem = 0;
            correctAnswers = 0;
            sessionProblems = [];
            recentOperands = [];
            sessionHistory = [];

            startScreen.classList.remove('active');
            practiceScreen.classList.add('active');

            startTime = Date.now();
            showNextProblem();
        }

        function loadOpState(op) {
            const s = opState[op];
            currentDifficulty = s.difficulty;
            correctStreak = s.streak;
            droppedFrom = s.droppedFrom;
            consecutiveTrivialCount = s.consecutiveTrivial;
            totalTrivialCount = s.totalTrivial;
            recentOperands = s.recentOperands;
        }

        function saveOpState(op) {
            const s = opState[op];
            s.difficulty = currentDifficulty;
            s.streak = correctStreak;
            s.droppedFrom = droppedFrom;
            s.consecutiveTrivial = consecutiveTrivialCount;
            s.totalTrivial = totalTrivialCount;
            s.recentOperands = recentOperands;
        }

        function problemsInRun() {
            return mixedQueue ? mixedQueue.length : totalProblems;
        }

        function showNextProblem() {
            if (mixedQueue) {
                selectedOperation = mixedQueue[currentProblem];
                loadOpState(selectedOperation);
            }
            const problem = pickProblem(selectedOperation, currentDifficulty);
            const { num1, num2, operator } = problem;
            sessionProblems.push(normalizeProblem(num1, num2, operator));
            if (isTrivial(num1, num2, selectedOperation)) {
                consecutiveTrivialCount++;
                totalTrivialCount++;
            } else {
                consecutiveTrivialCount = 0;
            }
            // Remember the numbers of the last two problems
            recentOperands = [...recentOperands, num1, num2].slice(-4);

            currentProblemData = problem;
            problemNum1El.textContent = currentProblemData.num1;
            problemOpEl.textContent = currentProblemData.operator;
            problemNum2El.textContent = currentProblemData.num2;
            answerInput.value = '';
            answerInput.placeholder = '?';
            answerInput.classList.remove('correct', 'incorrect');
            answerInput.focus();
            if (mixedQueue) saveOpState(selectedOperation);
            const partLabel = mixedQueue ? 'Mixed · ' : compassParts ? `${OPERATION_NAMES[selectedOperation]} · ` : '';
            progressEl.textContent = `${partLabel}Problem ${currentProblem + 1} of ${problemsInRun()}`;
            problemShownAt = Date.now();
        }

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function checkAnswer() {
            const userAnswer = parseInt(answerInput.value);

            if (isNaN(userAnswer)) return;

            const isCorrect = userAnswer === currentProblemData.answer;

            // Save to session history for review
            sessionHistory.push({
                operation: selectedOperation,
                num1: currentProblemData.num1,
                num2: currentProblemData.num2,
                operator: currentProblemData.operator,
                correctAnswer: currentProblemData.answer,
                userAnswer: userAnswer,
                isCorrect: isCorrect,
                ms: problemShownAt ? Date.now() - problemShownAt : null
            });

            if (isCorrect) {
                // Show green checkmark in input box
                answerInput.value = '';
                answerInput.placeholder = '✓';
                answerInput.classList.add('correct');
                correctAnswers++;
                correctStreak++;

                // Up a level after 2 correct in a row (max 4). Going back up into
                // a level the learner slipped out of this exercise takes 3, so a
                // learner on the edge of a level does not bounce in and out of it.
                const needed = droppedFrom.includes(currentDifficulty + 1) ? 3 : 2;
                if (correctStreak >= needed && currentDifficulty < 4) {
                    currentDifficulty++;
                    correctStreak = 0; // Reset streak after difficulty increase
                }
            } else {
                // Show red X in input box
                answerInput.value = '';
                answerInput.placeholder = '✗';
                answerInput.classList.add('incorrect');
                correctStreak = 0; // Reset streak on wrong answer

                // Decrease difficulty immediately on wrong answer (min 1)
                if (currentDifficulty > 1) {
                    if (!droppedFrom.includes(currentDifficulty)) droppedFrom.push(currentDifficulty);
                    currentDifficulty--;
                }
            }

            if (mixedQueue) {
                saveOpState(selectedOperation);
                const s = opState[selectedOperation];
                s.answered++;
                if (isCorrect) s.correct++;
                s.ms += sessionHistory[sessionHistory.length - 1].ms || 0;
                // An operation's last problem is answered: it is finished, so
                // Compass hears about it now, not only at the end of the set.
                if (s.answered === totalProblems) finishMixedPart(selectedOperation);
            }

            setTimeout(() => {
                currentProblem++;
                if (currentProblem < problemsInRun()) {
                    showNextProblem();
                } else if (mixedQueue) {
                    showResults();
                } else {
                    finishPart();
                }
            }, 400);
        }

        // One operation's 15 problems are done: tell Compass, then go on to the
        // next listed operation or to the results.
        function finishPart() {
            reportPart();
            runParts.push({
                operation: selectedOperation,
                correct: correctAnswers,
                total: totalProblems,
                seconds: Math.round((Date.now() - startTime) / 1000)
            });
            if (compassParts && partIndex < compassParts.length - 1) {
                showPartScreen();
            } else {
                showResults();
            }
        }

        // Mixed runs: one operation's 15 problems are answered. Its score and
        // time are its own problems only (time is the sum of their response
        // times, since the set interleaves them with the other operations).
        function finishMixedPart(op) {
            const s = opState[op];
            const items = sessionHistory.filter(item => item.operation === op);
            const seconds = Math.round(s.ms / 1000);
            reportPart({
                part: op,
                index: compassParts.indexOf(op) + 1,
                correct: s.correct,
                seconds,
                history: items
            });
            runParts.push({ operation: op, correct: s.correct, total: totalProblems, seconds });
        }

        function reportPart(mixedPart) {
            const history = mixedPart ? mixedPart.history : sessionHistory;
            const correct = mixedPart ? mixedPart.correct : correctAnswers;
            const report = {
                kind: 'part',
                part: mixedPart ? mixedPart.part : selectedOperation,
                index: mixedPart ? mixedPart.index : compassParts ? partIndex + 1 : 1,
                of: compassParts ? compassParts.length : 1,
                mode: runMode,
                status: 'finished',
                correct: correct,
                wrong: totalProblems - correct,
                seconds: mixedPart ? mixedPart.seconds : Math.round((Date.now() - startTime) / 1000),
                items: history.map(item => ({
                    prompt: `${item.num1} ${item.operator} ${item.num2}`,
                    answer: item.userAnswer,
                    correctAnswer: item.correctAnswer,
                    correct: item.isCorrect,
                    ms: item.ms
                })),
                appVersion: APP_VERSION
            };
            const block = document.createElement('script');
            block.type = 'application/json';
            block.setAttribute('data-compass-report', '');
            block.textContent = JSON.stringify(report);
            document.body.appendChild(block);
        }

        function showPartScreen() {
            practiceScreen.classList.remove('active');
            partScreen.classList.add('active');
            const left = compassParts.slice(partIndex + 1).map(p => OPERATION_NAMES[p]);
            const part = runParts[runParts.length - 1];
            document.getElementById('partDoneTitle').textContent = `${OPERATION_NAMES[selectedOperation]} done ✓`;
            renderScore(document.getElementById('partScore'), part.correct, part.total, part.seconds);
            celebrateIfEarned(part.correct, part.total);
            renderReview(document.getElementById('partReviewBody'), sessionHistory);
            document.getElementById('partLeft').textContent = left.length === 1 ? 'One more to go' : `${left.length} more to go`;
            nextPartBtn.textContent = `Next: ${left[0]} →`;
            // A beat before the button takes Enter, so the Enter that answered the
            // last problem cannot also skip this screen.
            nextPartBtn.disabled = true;
            setTimeout(() => {
                nextPartBtn.disabled = false;
                nextPartBtn.focus();
            }, 600);
        }

        function startNextPart() {
            if (!compassParts || partIndex >= compassParts.length - 1) return;
            stopFireworks();
            partIndex++;
            selectedOperation = compassParts[partIndex];
            partScreen.classList.remove('active');
            startPractice();
        }

        function formatTime(elapsed) {
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function accuracyOf(correct, total) {
            return total > 0 ? Math.round((correct / total) * 100) : 0;
        }

        // The score, accuracy and time of one exercise, as three big numbers.
        function renderScore(container, correct, total, elapsed) {
            container.innerHTML = '';
            [['Score', `${correct}/${total}`], ['Accuracy', `${accuracyOf(correct, total)}%`], ['Time', formatTime(elapsed)]]
                .forEach(([label, value]) => {
                    const item = document.createElement('div');
                    item.className = `result-item ${label.toLowerCase()}`;
                    const l = document.createElement('div');
                    l.className = 'result-label';
                    l.textContent = label;
                    const v = document.createElement('div');
                    v.className = 'result-value';
                    v.textContent = value;
                    item.append(l, v);
                    container.appendChild(item);
                });
        }

        // Every problem of one exercise: the learner's answer, and the right one where it was wrong.
        function renderReview(tbody, history) {
            tbody.innerHTML = '';
            history.forEach(item => {
                const row = document.createElement('tr');
                row.className = item.isCorrect ? 'correct' : 'incorrect';

                const problemCell = document.createElement('td');
                problemCell.className = 'problem-col';
                problemCell.textContent = `${item.num1} ${item.operator} ${item.num2} =`;
                row.appendChild(problemCell);

                const answerCell = document.createElement('td');
                answerCell.textContent = item.userAnswer;
                row.appendChild(answerCell);

                const correctCell = document.createElement('td');
                if (item.isCorrect) {
                    correctCell.innerHTML = '<span class="feedback-icon">✓</span>';
                } else {
                    correctCell.textContent = item.correctAnswer;
                    correctCell.style.color = '#333333';
                }
                row.appendChild(correctCell);

                tbody.appendChild(row);
            });
        }

        // One row per operation finished in this visit; the last one is the
        // exercise just finished.
        function renderSummary(markLast = true) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            runParts.forEach((part, i) => {
                const row = document.createElement('tr');
                if (markLast && i === runParts.length - 1) row.className = 'current';
                [OPERATION_NAMES[part.operation], `${part.correct}/${part.total}`,
                    `${accuracyOf(part.correct, part.total)}%`, formatTime(part.seconds)].forEach((text, col) => {
                    const cell = document.createElement('td');
                    cell.className = ['problem-col', 'score', 'accuracy', 'time'][col];
                    cell.textContent = text;
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });
            document.getElementById('summaryTable').classList.remove('hidden');
        }

        function showResults() {
            practiceScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            // Every screen shows the exercise just finished: its own score and its
            // own problems. In Compass mode a table of every exercise in this
            // visit follows, one score per operation.
            const part = runParts[runParts.length - 1];
            if (mixedQueue) {
                // One set, so one score for it, then one row per operation so a
                // weak operation still shows.
                restartBtn.classList.add('hidden');
                document.getElementById('resultsTitle').textContent = 'Mixed practice done ✓';
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                renderScore(document.getElementById('resultsScore'), correctAnswers, problemsInRun(), elapsed);
                celebrateIfEarned(correctAnswers, problemsInRun());
                runParts.sort((a, b) => compassParts.indexOf(a.operation) - compassParts.indexOf(b.operation));
                renderSummary(false);
            } else if (compassParts) {
                restartBtn.classList.add('hidden');
                document.getElementById('resultsTitle').textContent = `${OPERATION_NAMES[part.operation]} done ✓`;
                renderScore(document.getElementById('resultsScore'), part.correct, part.total, part.seconds);
                celebrateIfEarned(part.correct, part.total);
                renderSummary();
            } else {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                renderScore(document.getElementById('resultsScore'), correctAnswers, totalProblems, elapsed);
                celebrateIfEarned(correctAnswers, totalProblems);
            }
            renderReview(document.getElementById('reviewTableBody'), sessionHistory);
        }

        // A short burst of fireworks over the score when accuracy is above 85%:
        // a handful of rockets climb from the bottom, each pops into a ring of
        // square sparks that drift down and fade. About three seconds, no sound,
        // and nothing at all for anyone who asks their device for less motion.
        const CELEBRATE_ABOVE = 85;
        const fireworksCanvas = document.getElementById('fireworks');
        let fireworksFrame = null;
        let fireworksTimers = [];

        function celebrateIfEarned(correct, total) {
            if (total > 0 && (correct / total) * 100 > CELEBRATE_ABOVE) launchFireworks();
        }

        function stopFireworks() {
            if (fireworksFrame) cancelAnimationFrame(fireworksFrame);
            fireworksFrame = null;
            fireworksTimers.forEach(clearTimeout);
            fireworksTimers = [];
            fireworksCanvas.hidden = true;
        }

        function launchFireworks() {
            stopFireworks();
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const ctx = fireworksCanvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            fireworksCanvas.width = w * dpr;
            fireworksCanvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fireworksCanvas.hidden = false;

            const colors = ['#2563eb', '#0f766e', '#7c3aed', '#f59e0b', '#ef4444', '#22c55e'];
            const rockets = [];
            const sparks = [];
            const size = Math.max(4, Math.round(Math.min(w, h) / 120));
            const shots = 6;
            for (let i = 0; i < shots; i++) {
                fireworksTimers.push(setTimeout(() => {
                    const x = w * (0.15 + 0.7 * ((i * 0.37 + Math.random() * 0.25) % 1));
                    rockets.push({
                        x, y: h + size,
                        vy: -(h * 0.018 + Math.random() * h * 0.004),
                        burstAt: h * (0.18 + Math.random() * 0.25),
                        color: colors[i % colors.length]
                    });
                }, i * 380));
            }

            const burst = (r) => {
                const count = 28;
                const speed = Math.min(w, h) * 0.006 + Math.random() * 1.5;
                for (let k = 0; k < count * 1.5; k++) {
                    // An outer ring and a slower inner one
                    const inner = k >= count;
                    const angle = (Math.PI * 2 * k) / (inner ? count / 2 : count) + (inner ? 0.2 : 0);
                    const v = inner ? speed * 0.55 : speed;
                    sparks.push({
                        x: r.x, y: r.y,
                        vx: Math.cos(angle) * v,
                        vy: Math.sin(angle) * v,
                        life: 1,
                        color: k % 4 === 0 ? '#ffd166' : r.color
                    });
                }
            };

            const started = performance.now();
            const tick = (now) => {
                ctx.clearRect(0, 0, w, h);
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    r.y += r.vy;
                    ctx.fillStyle = r.color;
                    ctx.fillRect(r.x - size / 2, r.y, size, size);
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(r.x - size / 4, r.y + size * 1.5, size / 2, size * 2);
                    ctx.globalAlpha = 1;
                    if (r.y <= r.burstAt) {
                        burst(r);
                        rockets.splice(i, 1);
                    }
                }
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const p = sparks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.97;
                    p.vy = p.vy * 0.97 + 0.06;
                    p.life -= 0.012;
                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(Math.round(p.x), Math.round(p.y), size, size);
                }
                ctx.globalAlpha = 1;
                const launching = now - started < shots * 380;
                if (launching || rockets.length || sparks.length) {
                    fireworksFrame = requestAnimationFrame(tick);
                } else {
                    stopFireworks();
                }
            };
            fireworksFrame = requestAnimationFrame(tick);
        }

        function resetApp() {
            stopFireworks();
            resultsScreen.classList.remove('active');
            startScreen.classList.add('active');

            selectedOperation = null;
            currentDifficulty = 1;
            correctStreak = 0;
            droppedFrom = [];

            // Clear problem tracking
            sessionProblems = [];
            consecutiveTrivialCount = 0;
            totalTrivialCount = 0;
            recentOperands = [];
            sessionHistory = [];
            runParts = [];
        }

        // Compass chose the operations: skip the picker and start the first one.
        if (compassParts && runMode === 'mixed') {
            startMixedPractice();
        } else if (compassParts) {
            selectedOperation = compassParts[0];
            startPractice();
        }
    </script>
</body>
</html>
