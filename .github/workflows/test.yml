name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No passwords or credentials in any file, docs included
        run: bash tests/check-no-credentials.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Practice rules
        run: node --test
      - name: Simulated learners (for the log)
        run: node tests/simulate.js 500
      - name: Simulated months of warm-ups (for the log)
        run: node tests/simulate-days.js
