<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Automath lives on Vercel (Decision 27). The old GitHub Pages address
        // sends visitors there, keeping the query and the hash. A Compass launch
        // (`compass_parts` in the query) is left alone until every Compass
        // registry points at the new address, since a shell only lets an app
        // load from its listed hosts.
        (function () {
            if (location.hostname !== 'sigmaschools.github.io') return;
            if (/[?&]compass_parts=/.test(location.search)) return;
            location.replace('https://sigma-automath.vercel.app/' + location.search + location.hash);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automath - Math Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h2 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .problem-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px 0;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .problem {
            font-size: 72px;
            font-weight: 300;
            line-height: 1.2;
            width: 100%;
            position: relative;
        }

        .problem-line-1 {
            text-align: right;
            padding-right: 60px;
        }

        .problem-line-2 {
            text-align: right;
            padding-right: 60px;
            position: relative;
        }

        .problem-operator {
            position: absolute;
            left: 28px;
            width: 50px;
            text-align: left;
            color: var(--op-color, #000000);
        }

        /* Each operation has its own color: a bar along the top of the problem
           card, a light tint behind the numbers, and the sign itself, so a
           learner sees which operation it is before reading the numbers
           (Decision 20). The sign keeps the numbers' size and weight. */
        .problem-container[data-op] {
            border-top: 8px solid var(--op-color);
            border-radius: 10px;
            overflow: hidden;
            padding-top: 30px;
            background: linear-gradient(var(--op-tint), #ffffff 45%);
        }

        .problem-container[data-op="addition"]       { --op-color: #2563eb; --op-tint: #eff6ff; }
        .problem-container[data-op="subtraction"]    { --op-color: #d97706; --op-tint: #fffbeb; }
        .problem-container[data-op="multiplication"] { --op-color: #7c3aed; --op-tint: #f5f3ff; }
        .problem-container[data-op="division"]       { --op-color: #0f766e; --op-tint: #f0fdfa; }


        .input-container {
            width: 100%;
            position: relative;
        }

        /* The red cross beside a wrong answer (Decision 28) */
        .answer-mark {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            color: #ef4444;
            pointer-events: none;
        }

        /* The green tick beside a right answer (Decision 26) */
        .answer-mark.right {
            color: #22c55e;
        }

        input[type="number"] {
            font-size: 72px;
            padding: 15px 20px;
            padding-right: 60px;
            border: none;
            border-top: 3px solid #000000;
            border-radius: 0;
            width: 100%;
            text-align: right;
            font-family: inherit;
            transition: background-color 0.2s, border-color 0.2s;
            box-sizing: border-box;
            background-color: #f5f5f5;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Hide the browser's up/down spinner arrows on the answer field */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            outline: none;
            border-top-color: #000000;
        }

        input[type="number"].correct {
            background-color: #e8f5e9;
            border-top-color: #22c55e;
            color: #22c55e;
            caret-color: transparent;
        }

        input[type="number"].incorrect {
            background-color: #ffebee;
            border-top-color: #ef4444;
            color: #ef4444;
            caret-color: transparent;
        }

        /* After a miss, once the wrong answer has shown: the right answer,
           in green on a green box, with no mark beside it (Decision 28) */
        input[type="number"].corrected {
            background-color: #e8f5e9;
            border-top-color: #22c55e;
            color: #15803d;
            caret-color: transparent;
        }

        input[type="number"]::placeholder {
            font-size: 72px;
            color: #cccccc;
        }

        input[type="number"].correct::placeholder {
            color: #22c55e;
        }

        input[type="number"].incorrect::placeholder {
            color: #ef4444;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        .results {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .result-item {
            margin: 0;
        }

        .result-value {
            font-size: 56px;
            font-weight: 300;
            margin-top: 10px;
        }

        .result-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-section {
            margin-top: 40px;
            padding-top: 0;
        }

        .review-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 24px;
            color: #333333;
        }

        .review-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: 400;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .review-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .review-table tr.correct {
            background-color: #ffffff;
        }

        .review-table tr.incorrect {
            background-color: #ffebee;
            color: #ef4444;
        }

        .review-table .problem-col {
            text-align: left;
            padding-left: 20px;
        }

        .review-table .feedback-icon {
            font-size: 20px;
            color: #22c55e;
        }

        .review-table .feedback-icon.incorrect {
            color: #ef4444;
        }

        .hidden {
            display: none;
        }

        /* Facts mastered so far (Compass runs with a fact record, Decision 19) */
        .mastery {
            font-size: 17px;
            color: #555555;
            margin-top: 14px;
            line-height: 1.6;
        }

        .mastery:empty {
            display: none;
        }

        .part-left {
            font-size: 18px;
            color: #666666;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .summary-table {
            margin-top: 30px;
        }

        .summary-table tr.current {
            font-weight: 500;
        }

        /* Each number on a score screen has its own color, so the three values
           read apart at a glance. The same colors mark the summary columns. */
        .result-item.score .result-value, .summary-table td.score { color: #2563eb; }
        .result-item.accuracy .result-value, .summary-table td.accuracy { color: #0f766e; }
        .result-item.time .result-value, .summary-table td.time { color: #7c3aed; }
        .result-item.score .result-label { color: #2563eb; }
        .result-item.accuracy .result-label { color: #0f766e; }
        .result-item.time .result-label { color: #7c3aed; }
        .result-item .result-label { font-weight: 600; }

        /* The one way forward between exercises: big, colored and right under
           the title, so nobody has to hunt for it. */
        #nextPartBtn {
            display: block;
            margin: 32px auto 8px auto;
            background: #2563eb;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            padding: 22px 56px;
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        #nextPartBtn:hover {
            background: #1d4ed8;
            opacity: 1;
        }

        #nextPartBtn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #nextPartBtn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .next-hint {
            font-size: 14px;
            color: #737373;
            margin-bottom: 10px;
        }

        /* On-screen number pad for touch screens (Decision 18) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 320px;
            margin: 0 auto;
        }

        .keypad.hidden {
            display: none;
        }

        .keypad button {
            background: #f5f5f5;
            color: #000000;
            border: 1px solid #dddddd;
            border-radius: 10px;
            font-size: 30px;
            height: 64px;
            padding: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .keypad button:active {
            background: #e5e5e5;
        }

        .keypad button.key-enter {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
        }

        body.with-keypad .problem-container {
            margin: 20px auto 20px auto;
        }

        /* Answer out loud (Decision 23): a microphone switch under the answer */
        .voice {
            margin: -6px auto 16px auto;
            text-align: center;
        }

        #voiceBtn.hidden {
            display: none;
        }

        .voice.hidden {
            display: none;
        }

        #voiceBtn {
            background: transparent;
            color: #737373;
            border: 1px solid #dddddd;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 18px;
            margin: 0;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        #voiceBtn svg {
            width: 18px;
            height: 18px;
        }

        #voiceBtn.on {
            color: #16a34a;
            border-color: #86efac;
            background: #f0fdf4;
        }

        #voiceBtn.on .voice-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #16a34a;
            animation: voice-pulse 1.2s ease-in-out infinite;
        }

        #voiceBtn.on.preparing .voice-dot {
            animation: none;
            opacity: 0.5;
        }

        .voice-note {
            margin-top: 8px;
            font-size: 15px;
            color: #737373;
        }

        .voice-note.hidden {
            display: none;
        }

        /* Listening (Decision 25): while the learner answers out loud, a live
           waveform of their voice takes the number pad's place. It is the only
           sign that the microphone is on. */
        .listen {
            width: 320px;
            margin: 0 auto;
            text-align: center;
        }

        .listen.hidden {
            display: none;
        }

        #wave {
            display: block;
            width: 320px;
            height: 120px;
            margin: 0 auto;
        }

        .listen-caption {
            font-size: 16px;
            color: #737373;
            min-height: 22px;
            margin: 4px 0 6px 0;
        }

        /* Enter for a heard number (Decision 31): the learner checks the box
           shows what they meant, then sends it. Dimmed until a number is heard. */
        #voiceEnter {
            display: block;
            width: 100%;
            height: 64px;
            margin: 6px 0 10px 0;
            padding: 0;
            background: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 10px;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            touch-action: manipulation;
        }

        #voiceEnter:disabled {
            opacity: 0.35;
        }

        #voiceEnter.hidden, #typeBtn.hidden {
            display: none;
        }

        #typeBtn {
            background: transparent;
            color: #737373;
            border: 1px solid #dddddd;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 18px;
            margin: 6px 0 0 0;
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        #typeBtn svg {
            width: 18px;
            height: 18px;
        }

        @keyframes voice-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        @media (prefers-reduced-motion: reduce) {
            #voiceBtn.on .voice-dot { animation: none; }
        }

        /* Fireworks over a score above 85% (Decision 17). Clicks pass through. */
        #fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>

    <!-- The practice rules, with no page code: which problems each level holds,
         how the next one is picked, when a learner moves up or down, and what
         counts as fluent. tests/ loads this block on its own (Node, no browser),
         so keep it free of the DOM. -->
    <script id="automath-core">
        const AutomathCore = (() => {
            // A correct answer is fluent when it comes within this many ms
            // (Decision 18). Never shown to the learner; it decides levelling up
            // and is reported to Compass.
            const FLUENT_MS = { addition: 3000, subtraction: 3000, multiplication: 3000, division: 3000 };
            // An answer that took longer than this is flagged in the report: the
            // learner most likely stopped, so its time says little about recall.
            const OUTLIER_MS = 30000;
            // A missed problem comes back once, after this many other problems.
            const RETRY_AFTER = 3;

            function isTrivial(num1, num2, operation) {
                if (operation === 'multiplication') return num2 === 0 || num2 === 1;
                if (operation === 'division') return num2 === 1;
                if (operation === 'addition') return num2 === 0;
                if (operation === 'subtraction') return num2 === 0;
                return false;
            }

            // 7 × 2 and 2 × 7 are the same fact; 7 − 2 and 2 − 7 are not.
            function normalizeProblem(num1, num2, operator) {
                if (operator === '+' || operator === '×') {
                    return `${Math.min(num1, num2)},${Math.max(num1, num2)},${operator}`;
                }
                return `${num1},${num2},${operator}`;
            }

            // Every problem a level can give, listed once. Every level is a set
            // of facts (Decision 18): level 4 of addition and subtraction is the
            // facts that cross ten, not two-digit sums.
            const poolCache = {};
            function problemsAt(operation, level) {
                const key = `${operation}${level}`;
                if (poolCache[key]) return poolCache[key];
                const list = [];
                const add = (num1, num2, operator, answer) => list.push({ num1, num2, operator, answer });
                const pairs = (aFrom, aTo, bFrom, bTo, make) => {
                    for (let a = aFrom; a <= aTo; a++) {
                        const from = typeof bFrom === 'function' ? bFrom(a) : bFrom;
                        const to = typeof bTo === 'function' ? bTo(a) : bTo;
                        for (let b = from; b <= to; b++) make(a, b);
                    }
                };
                switch (operation) {
                    case 'addition': {
                        const plus = (a, b) => add(a, b, '+', a + b);
                        if (level === 1) pairs(1, 4, 1, a => 5 - a, plus);                    // within 5
                        else if (level === 2) pairs(1, 9, 1, a => 10 - a, plus);              // within 10
                        else if (level === 3) pairs(5, 19, 1, a => Math.min(10, 20 - a), plus); // within 20
                        else pairs(2, 9, a => Math.max(2, 11 - a), 9, plus);                  // crossing ten: 8 + 7
                        break;
                    }
                    case 'subtraction': {
                        const minus = (a, b) => add(a, b, '−', a - b);
                        if (level === 1) pairs(2, 5, 1, a => a - 1, minus);                       // within 5
                        else if (level === 2) pairs(3, 10, 1, a => a - 1, minus);                 // within 10
                        else if (level === 3) pairs(6, 20, 1, a => Math.min(10, a - 1), minus);   // within 20
                        else pairs(11, 18, a => Math.max(2, a - 9), 9, minus);                    // crossing ten: 13 − 6
                        break;
                    }
                    case 'multiplication': {
                        const times = (a, b) => add(a, b, '×', a * b);
                        const [aTo, bTo] = [[10, 2], [10, 5], [10, 10], [12, 12]][level - 1];
                        pairs(1, aTo, 0, bTo, times);
                        break;
                    }
                    case 'division': {
                        const over = (b, q) => add(b * q, b, '÷', q);
                        const [bFrom, bTo, qTo] = [[1, 2, 10], [1, 5, 10], [2, 10, 12], [2, 12, 12]][level - 1];
                        pairs(bFrom, bTo, 1, qTo, over);
                        break;
                    }
                }
                poolCache[key] = list;
                return list;
            }

            // One operation's practice state within an exercise.
            function newState() {
                return {
                    level: 1,
                    streak: 0,          // fluent correct answers in a row
                    droppedFrom: [],    // levels slipped out of this exercise
                    seen: new Set(),    // normalized problems already shown
                    consecutiveTrivial: 0,
                    totalTrivial: 0,
                    recentOperands: []  // the numbers of the last two problems
                };
            }

            // The next problem: never one already seen (7 × 2 and 2 × 7 count as
            // one). Each unseen problem gets a cost: 1 if it uses a number from the
            // last two problems, 3 if it breaks the trivial limits (two ×0/×1-type
            // problems in a row, or more than 3), and 2.5 for each level it is away
            // from the learner's level (a little more going down than up). The
            // cheapest is picked, at random among equals. So the soft rules give
            // way before the level does, except that a trivial problem the limits
            // forbid is swapped for a fresh one from the next level: a learner who
            // stays on level 1 a long time gets ×3 facts, not a run of ×0 and ×1.
            function pickProblem(operation, s, rand = Math.random) {
                let best = [];
                let bestCost = Infinity;
                for (let l = 1; l <= 4; l++) {
                    const away = l >= s.level ? (l - s.level) * 2.5 : (s.level - l) * 2.6;
                    if (away > bestCost) continue;
                    problemsAt(operation, l).forEach(p => {
                        if (s.seen.has(normalizeProblem(p.num1, p.num2, p.operator))) return;
                        const trivial = isTrivial(p.num1, p.num2, operation);
                        const cost = away
                            + (trivial && (s.consecutiveTrivial >= 1 || s.totalTrivial >= 3) ? 3 : 0)
                            + (s.recentOperands.includes(p.num1) || s.recentOperands.includes(p.num2) ? 1 : 0);
                        if (cost < bestCost) {
                            bestCost = cost;
                            best = [];
                        }
                        if (cost === bestCost) best.push(p);
                    });
                }
                if (best.length > 0) return best[Math.floor(rand() * best.length)];
                // Every problem of this operation has been seen (cannot happen in
                // 10 problems, but never get stuck): repeat one at this level.
                const pool = problemsAt(operation, s.level);
                return pool[Math.floor(rand() * pool.length)];
            }

            function recordShown(s, problem, operation) {
                s.seen.add(normalizeProblem(problem.num1, problem.num2, problem.operator));
                if (isTrivial(problem.num1, problem.num2, operation)) {
                    s.consecutiveTrivial++;
                    s.totalTrivial++;
                } else {
                    s.consecutiveTrivial = 0;
                }
                s.recentOperands = [...s.recentOperands, problem.num1, problem.num2].slice(-4);
            }

            function isFluent(operation, correct, ms) {
                return correct && ms != null && ms <= FLUENT_MS[operation];
            }

            // Moving between levels (Decisions 17 and 18): up after 2 fluent
            // correct answers in a row (3 to go back into a level slipped out of
            // this exercise); down one on any wrong answer. A correct but slow
            // answer neither builds nor breaks the streak: the fact is known but
            // not yet automatic, so the learner stays at this level.
            function recordAnswer(s, correct, fluent) {
                if (!correct) {
                    s.streak = 0;
                    if (s.level > 1) {
                        if (!s.droppedFrom.includes(s.level)) s.droppedFrom.push(s.level);
                        s.level--;
                    }
                    return;
                }
                if (!fluent) return;
                s.streak++;
                const needed = s.droppedFrom.includes(s.level + 1) ? 3 : 2;
                if (s.streak >= needed && s.level < 4) {
                    s.level++;
                    s.streak = 0;
                }
            }

            // Mixed runs: rounds of every operation once in a random order,
            // never the same operation twice in a row. `counts` is the number of
            // problems for every operation, or one number per operation (a
            // check-in is shorter than a practice set); an operation whose
            // problems are used up drops out of the later rounds.
            function buildMixedQueue(parts, counts, rand = Math.random) {
                const left = {};
                parts.forEach(p => { left[p] = typeof counts === 'number' ? counts : counts[p]; });
                const queue = [];
                for (;;) {
                    const round = parts.filter(p => left[p] > 0);
                    if (round.length === 0) break;
                    let order;
                    do {
                        order = [...round];
                        for (let i = order.length - 1; i > 0; i--) {
                            const j = Math.floor(rand() * (i + 1));
                            [order[i], order[j]] = [order[j], order[i]];
                        }
                    } while (round.length > 1 && queue.length > 0 && order[0] === queue[queue.length - 1]);
                    order.forEach(p => left[p]--);
                    queue.push(...order);
                }
                return queue;
            }

            return {
                FLUENT_MS, OUTLIER_MS, RETRY_AFTER,
                isTrivial, normalizeProblem, problemsAt, newState, pickProblem,
                recordShown, isFluent, recordAnswer, buildMixedQueue
            };
        })();
    </script>
    <script id="automath-facts">
        // Fact mastery across days (Decision 19). Every fact the warm-up can
        // give has a state for each learner: Unseen, Learning, Fluent or
        // Mastered, with a review date. Automath keeps no storage of its own:
        // the record goes to Compass in a `state` report and comes back in the
        // `compass_state` launch parameter. Days are local calendar days,
        // counted from 1 January 1970.
        const AutomathFacts = (() => {
            const OPS = ['addition', 'subtraction', 'multiplication', 'division'];
            const UNSEEN = 0, LEARNING = 1, FLUENT = 2, MASTERED = 3;
            const FORMAT = '1';
            // Days to the next review after each fast, correct review in a row.
            const INTERVALS = [1, 3, 7, 14, 30, 60, 120];
            // A fact that has slipped before comes back sooner.
            const LAPSED_FACTOR = 0.6;
            // After graduating, an operation is checked after 1, 2, 4, then
            // every 8 weeks.
            const CHECKIN_DAYS = [7, 14, 28, 56];
            const GRADUATE_SHARE = 0.95;  // of an operation's facts Mastered, and none Learning
            const SESSION = 10;           // problems per operation on a practice day (Decision 21)
            const CHECKIN = 10;           // problems per operation on a check-in
            const FOCUS_FACTS = 4;        // weakest Learning facts practised in a session
            const MAX_LEARNING = 6;       // no new facts while this many are being learned
            const MAX_RULE_FACTS = 3;     // n + 0, n × 1 and the like, per set
            const DUE_WHILE_NEW = 5;      // review places while new facts are still coming
            const CHECKIN_SLIPS_ALLOWED = 1; // more slips than this bring the operation back
            const FLUENT_FLOOR_MS = 3000; // the 3 s of Decision 18
            const TYPING_MARGIN_MS = 1500;
            const FLUENT_CAP_MS = 6000;

            // The fact table: every problem any level can give, once (7 × 8 and
            // 8 × 7 are one fact). The order is fixed, since the record stores
            // facts by position; changing a level's problems needs a new FORMAT.
            const COMMUTES = { addition: true, multiplication: true };
            function isRuleFact(a, b, op) {
                return AutomathCore.isTrivial(a, b, op) || (!!COMMUTES[op] && AutomathCore.isTrivial(b, a, op));
            }
            const TABLE = {};
            const INDEX = {};
            OPS.forEach(op => {
                const byKey = new Map();
                for (let level = 1; level <= 4; level++) {
                    AutomathCore.problemsAt(op, level).forEach(p => {
                        const key = AutomathCore.normalizeProblem(p.num1, p.num2, p.operator);
                        if (byKey.has(key)) return;
                        const [a, b] = COMMUTES[op]
                            ? [Math.min(p.num1, p.num2), Math.max(p.num1, p.num2)] : [p.num1, p.num2];
                        byKey.set(key, { key, num1: a, num2: b, operator: p.operator, answer: p.answer,
                            tier: level, trivial: isRuleFact(a, b, op) });
                    });
                }
                TABLE[op] = [...byKey.values()].sort((x, y) => x.num1 - y.num1 || x.num2 - y.num2);
                INDEX[op] = new Map(TABLE[op].map((f, i) => [f.key, i]));
            });

            function blank() {
                return { s: UNSEEN, n: 0, d: 0, x: 0, w: 0, i: 0, due: 0 };
            }

            function create(today) {
                const facts = {};
                OPS.forEach(op => { facts[op] = TABLE[op].map(() => ({ ...blank(), due: today })); });
                return { base: today, typing: null, grad: {}, facts };
            }

            // ---- The record as a short URL-safe string ----
            // FORMAT~base day~typing speed (100 ms)~graduation~four fact strings.
            // Each fact is 5 characters: state, in-a-row count, fluent days,
            // slips, weakness and interval step in 15 bits, then the review day
            // (days after the base day) in 15 bits.
            const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

            function encodeFact(f, base) {
                const packed = f.s | (f.n << 2) | (f.d << 4) | (f.x << 6) | (f.w << 8) | (f.i << 12);
                const due = Math.max(0, Math.min(32767, f.due - base));
                const v = packed * 32768 + due;
                let out = '';
                for (let k = 4; k >= 0; k--) out += B64[Math.floor(v / Math.pow(64, k)) % 64];
                return out;
            }

            function decodeFact(str, base) {
                let v = 0;
                for (const ch of str) {
                    const c = B64.indexOf(ch);
                    if (c < 0) return null;
                    v = v * 64 + c;
                }
                const due = v % 32768;
                const p = Math.floor(v / 32768);
                return { s: p & 3, n: (p >> 2) & 3, d: (p >> 4) & 3, x: (p >> 6) & 3, w: (p >> 8) & 15, i: (p >> 12) & 7, due: base + due };
            }

            function encode(rec) {
                const grad = OPS.map(op => rec.grad[op] ? `${rec.grad[op].step}.${(rec.grad[op].next - rec.base).toString(36)}` : '').join(',');
                const typing = rec.typing == null ? '' : Math.round(rec.typing / 100).toString(36);
                return [FORMAT, rec.base.toString(36), typing, grad,
                    ...OPS.map(op => rec.facts[op].map(f => encodeFact(f, rec.base)).join(''))].join('~');
            }

            // A damaged or unknown record gives null: the learner starts afresh.
            function decode(str) {
                try {
                    if (!str) return null;
                    const parts = String(str).split('~');
                    if (parts.length !== 8 || parts[0] !== FORMAT) return null;
                    const base = parseInt(parts[1], 36);
                    if (!Number.isFinite(base)) return null;
                    const rec = { base, typing: parts[2] ? parseInt(parts[2], 36) * 100 : null, grad: {}, facts: {} };
                    const grads = parts[3].split(',');
                    if (grads.length !== OPS.length) return null;
                    OPS.forEach((op, k) => {
                        if (!grads[k]) return;
                        const [step, next] = grads[k].split('.');
                        rec.grad[op] = { step: parseInt(step, 10), next: base + parseInt(next, 36) };
                    });
                    for (let k = 0; k < OPS.length; k++) {
                        const op = OPS[k];
                        const s = parts[4 + k];
                        if (s.length !== TABLE[op].length * 5) return null;
                        rec.facts[op] = [];
                        for (let j = 0; j < s.length; j += 5) {
                            const f = decodeFact(s.slice(j, j + 5), base);
                            if (!f) return null;
                            rec.facts[op].push(f);
                        }
                    }
                    return rec;
                } catch (e) {
                    return null;
                }
            }

            // ---- Fluency ----
            // Fluent = correct within 3 s, or within the learner's own typing
            // time plus 1.5 s if they type slowly (measured on rule facts such
            // as 4 + 0 or 6 × 1), never more than 6 s.
            function fluentLimit(rec) {
                if (!rec || rec.typing == null) return FLUENT_FLOOR_MS;
                return Math.min(FLUENT_CAP_MS, Math.max(FLUENT_FLOOR_MS, rec.typing + TYPING_MARGIN_MS));
            }

            function isFluent(rec, correct, ms) {
                return correct && ms != null && ms <= fluentLimit(rec);
            }

            function interval(f) {
                const days = INTERVALS[Math.min(f.i, INTERVALS.length - 1)];
                return f.x > 0 ? Math.max(1, Math.round(days * LAPSED_FACTOR)) : days;
            }

            function slip(f, today, weight) {
                if (f.s === FLUENT || f.s === MASTERED) f.x = Math.min(3, f.x + 1);
                f.s = LEARNING;
                f.n = 0;
                f.d = 0;
                f.i = 0;
                f.w = Math.min(15, f.w + weight);
                f.due = today;
            }

            // A right but slow answer on a Mastered fact (often rust after days
            // away) steps it down to Fluent, not all the way to Learning: it is
            // asked again the next day, and one fast answer then makes it
            // Mastered again (Decision 22). A wrong answer is still a slip.
            function rust(f, today) {
                f.x = Math.min(3, f.x + 1);
                f.s = FLUENT;
                f.d = 2;
                f.i = 0;
                f.w = Math.min(15, f.w + 1);
                f.due = today + 1;
            }

            // One scored answer. Retries of a missed problem are not recorded.
            function recordAnswer(rec, op, key, correct, ms, today) {
                const idx = INDEX[op].get(key);
                if (idx === undefined) return;
                const f = rec.facts[op][idx];
                const fluent = isFluent(rec, correct, ms);
                if (correct && ms != null && TABLE[op][idx].trivial && ms < 20000) {
                    rec.typing = rec.typing == null ? ms : Math.round(rec.typing * 0.7 + ms * 0.3);
                }
                if (!correct) return slip(f, today, 4);
                if (!fluent) return f.s === MASTERED ? rust(f, today) : slip(f, today, 2);
                f.w = Math.max(0, f.w - 3);
                if (f.s === UNSEEN) {
                    // Fast and right on first sight: the fact was known before
                    // (a basic fact cannot be guessed that fast), so it counts
                    // as two fluent days. One more fast answer on a later day, 3
                    // days on, shows it was kept, and it is Mastered.
                    f.s = FLUENT; f.d = 2; f.i = 1; f.due = today + INTERVALS[1];
                } else if (f.s === LEARNING) {
                    f.n++;
                    if (f.n >= 2) {
                        f.s = FLUENT; f.n = 0; f.d = 1; f.i = 0; f.due = today + 1;
                    }
                } else if (today >= f.due) {
                    // A review on or after its date: one more fluent day.
                    f.d = Math.min(3, f.d + 1);
                    if (f.s === FLUENT && f.d >= 3) f.s = MASTERED;
                    f.i = Math.min(INTERVALS.length - 1, f.i + 1);
                    f.due = today + interval(f);
                }
                // Fluent again before its date (as a known fact): no change.
            }

            function counts(rec, op) {
                const c = { unseen: 0, learning: 0, fluent: 0, mastered: 0, total: TABLE[op].length };
                rec.facts[op].forEach(f => {
                    c[['unseen', 'learning', 'fluent', 'mastered'][f.s]]++;
                });
                return c;
            }

            // ---- The fact chart for guides and parents (Decision 32) ----
            // Every fact and its stage, as a Compass `mastery` report: Compass
            // draws one square per fact on the week screen guides and parents
            // read, so it needs the stages spelled out (the `state` record is
            // opaque to it). Addition and multiplication run by the smaller
            // number, subtraction and division by the number taken away or
            // divided by, so each fact family sits together.
            const STAGES = ['unseen', 'learning', 'fluent', 'mastered'];
            const GROUP_NAMES = { addition: 'Addition', subtraction: 'Subtraction', multiplication: 'Multiplication', division: 'Division' };
            const BY_SECOND = { subtraction: true, division: true };
            function masteryReport(rec) {
                const groups = OPS.map(op => {
                    const order = TABLE[op].map((t, i) => i);
                    if (BY_SECOND[op]) {
                        order.sort((x, y) => TABLE[op][x].num2 - TABLE[op][y].num2 || TABLE[op][x].num1 - TABLE[op][y].num1);
                    }
                    return {
                        name: GROUP_NAMES[op],
                        items: order.map(i => {
                            const t = TABLE[op][i];
                            return { label: `${t.num1} ${t.operator} ${t.num2} = ${t.answer}`, stage: STAGES[rec.facts[op][i].s] };
                        })
                    };
                });
                return { kind: 'mastery', title: 'Math facts', subject: 'math', groups };
            }

            // ---- Choosing the problems ----
            function shuffle(list, rand) {
                for (let i = list.length - 1; i > 0; i--) {
                    const j = Math.floor(rand() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
                return list;
            }

            function asProblem(op, idx, rand) {
                const t = TABLE[op][idx];
                const swap = !!COMMUTES[op] && t.num1 !== t.num2 && rand() < 0.5;
                return { num1: swap ? t.num2 : t.num1, num2: swap ? t.num1 : t.num2, operator: t.operator, answer: t.answer, key: t.key };
            }

            // Put the picks in an order where the same fact never comes back
            // within 3 problems and, where possible, no two problems in a row
            // share a number (6 × 8 then 7 × 8 are easy to confuse).
            function arrange(op, picks, rand) {
                const left = shuffle([...picks], rand);
                const out = [];
                while (left.length > 0) {
                    const prev = out[out.length - 1];
                    const recent = out.slice(-3);
                    // A fact with more asks still to place goes first, so the
                    // repeats spread out instead of piling up at the end.
                    const score = idx => {
                        let s = -2 * left.filter(k => k === idx).length;
                        if (recent.includes(idx)) s += 20;
                        if (prev !== undefined) {
                            const a = TABLE[op][idx], b = TABLE[op][prev];
                            if (a.num1 === b.num1 || a.num1 === b.num2 || a.num2 === b.num1 || a.num2 === b.num2) s += 1;
                        }
                        return s;
                    };
                    let best = 0;
                    for (let k = 1; k < left.length; k++) if (score(left[k]) < score(left[best])) best = k;
                    out.push(left.splice(best, 1)[0]);
                }
                return out;
            }

            // A practice day: about 6 asks of the weakest Learning facts, the
            // reviews that are due, a few new facts while few are being learned,
            // and known facts to fill.
            function planSession(rec, op, today, rand = Math.random) {
                const facts = rec.facts[op];
                const all = facts.map((f, i) => i);
                const picks = [];
                const used = new Set();
                let rule = 0;
                // Rule facts (n + 0, n × 1) are tracked but served sparingly: at
                // most 3 in a set, as Decision 17 already limits them.
                const take = (idx, times = 1, force = false) => {
                    if (used.has(idx)) return;
                    if (TABLE[op][idx].trivial && !force) {
                        if (rule >= MAX_RULE_FACTS) return;
                        rule++;
                    }
                    for (let t = 0; t < times && picks.length < SESSION; t++) picks.push(idx);
                    used.add(idx);
                };

                const learning = shuffle(all.filter(i => facts[i].s === LEARNING), rand)
                    .sort((a, b) => facts[b].w - facts[a].w);
                // Focus asks leave at least 4 places for reviews and new facts.
                learning.slice(0, FOCUS_FACTS).forEach(i => {
                    const room = SESSION - 4 - picks.length;
                    if (room >= 2) take(i, Math.min(room, facts[i].w >= 8 ? 3 : 2));
                });

                // Fluent facts waiting to be confirmed come before Mastered ones;
                // within each, the longest overdue first. While facts are still
                // unseen and few are being learned, reviews get 5 places so the
                // rest of the table keeps coming.
                const due = shuffle(all.filter(i => (facts[i].s === FLUENT || facts[i].s === MASTERED) && facts[i].due <= today), rand)
                    .sort((a, b) => facts[a].s - facts[b].s || facts[a].due - facts[b].due);
                const unseen = shuffle(all.filter(i => facts[i].s === UNSEEN), rand)
                    .sort((a, b) => TABLE[op][a].tier - TABLE[op][b].tier || TABLE[op][a].trivial - TABLE[op][b].trivial);
                const learningCount = learning.length;
                const newRoom = Math.max(0, (MAX_LEARNING - learningCount) * 2);
                const knownLeft = all.some(i => (facts[i].s === FLUENT || facts[i].s === MASTERED) && facts[i].due > today);
                const dueRoom = unseen.length > 0 && newRoom > 0
                    ? DUE_WHILE_NEW
                    : Math.max(4, SESSION - picks.length - (knownLeft ? 2 : 0));
                due.slice(0, dueRoom).forEach(i => take(i));

                unseen.slice(0, Math.min(newRoom, SESSION - picks.length)).forEach(i => take(i));

                const known = shuffle(all.filter(i => !used.has(i) && (facts[i].s === FLUENT || facts[i].s === MASTERED)), rand);
                known.slice(0, SESSION - picks.length).forEach(i => take(i));

                // Still short (early days, few facts known): more new facts, then
                // the rest of the Learning facts, then anything.
                const rest = [...unseen, ...learning, ...shuffle([...all], rand)].filter(i => !used.has(i));
                for (const pass of [false, true]) {
                    for (const i of rest) {
                        if (picks.length >= SESSION) break;
                        take(i, 1, pass);
                    }
                }
                return arrange(op, picks, rand).map(i => asProblem(op, i, rand));
            }

            // A check-in for a graduated operation: facts that slipped last time,
            // then the reviews that are due, then a sample of mastered facts.
            function planCheckin(rec, op, today, rand = Math.random) {
                const facts = rec.facts[op];
                const all = facts.map((f, i) => i);
                const order = [
                    ...shuffle(all.filter(i => facts[i].s === LEARNING), rand),
                    ...shuffle(all.filter(i => facts[i].s !== UNSEEN && facts[i].s !== LEARNING && facts[i].due <= today), rand)
                        .sort((a, b) => facts[a].due - facts[b].due),
                    ...shuffle(all.filter(i => facts[i].s === MASTERED), rand),
                    ...shuffle(all.filter(i => facts[i].s !== UNSEEN), rand)
                ];
                const picks = [...new Set(order)].slice(0, CHECKIN);
                return arrange(op, picks, rand).map(i => asProblem(op, i, rand));
            }

            // ---- Graduation ----
            function isGraduated(rec, op) {
                return !!rec.grad[op];
            }

            // What today holds for an operation: daily practice, a check-in, or
            // nothing (graduated, and the next check-in is not due yet).
            function todayKind(rec, op, today) {
                const g = rec.grad[op];
                if (!g) return 'practice';
                return today >= g.next ? 'checkin' : 'rest';
            }

            function ready(rec, op) {
                const c = counts(rec, op);
                return c.learning === 0 && c.mastered >= GRADUATE_SHARE * c.total;
            }

            // After an operation's set: a check-in moves its schedule on, or
            // brings the operation back to daily practice after 2 or more slips
            // (only the slipped facts are Learning again; nothing else resets).
            // On a good check-in, mastered facts that have never slipped and are
            // overdue but were not asked move out too: the sample stood for them.
            // A practice day can graduate the operation.
            function finishPart(rec, op, kind, answers, today) {
                if (kind === 'checkin') {
                    const slips = answers.filter(a => !a.fluent).length;
                    if (slips > CHECKIN_SLIPS_ALLOWED) {
                        delete rec.grad[op];
                        return 'back';
                    }
                    const asked = new Set(answers.map(a => a.key));
                    rec.facts[op].forEach((f, i) => {
                        if (f.s === MASTERED && f.x === 0 && f.due <= today && !asked.has(TABLE[op][i].key)) {
                            f.i = Math.min(INTERVALS.length - 1, f.i + 1);
                            f.due = today + interval(f);
                        }
                    });
                    const g = rec.grad[op];
                    g.step = Math.min(CHECKIN_DAYS.length - 1, g.step + 1);
                    g.next = today + CHECKIN_DAYS[g.step];
                    return 'kept';
                }
                if (kind === 'practice' && ready(rec, op)) {
                    rec.grad[op] = { step: 0, next: today + CHECKIN_DAYS[0] };
                    return 'graduated';
                }
                return null;
            }

            // When each operation is next needed, for Compass: today for daily
            // practice, the check-in day for a graduated operation.
            function dueDays(rec, today) {
                const out = {};
                OPS.forEach(op => {
                    out[op] = rec.grad[op] ? Math.max(today, rec.grad[op].next) : today;
                });
                return out;
            }

            function isoDay(day) {
                return new Date(day * 86400000).toISOString().slice(0, 10);
            }

            function localDay(date = new Date()) {
                return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
            }

            return {
                OPS, UNSEEN, LEARNING, FLUENT, MASTERED, INTERVALS, CHECKIN_DAYS, SESSION, CHECKIN, TABLE,
                create, encode, decode, fluentLimit, isFluent, recordAnswer, counts, masteryReport,
                planSession, planCheckin, isGraduated, todayKind, ready, finishPart, dueDays, isoDay, localDay
            };
        })();
    </script>
    <script id="automath-speech">
        // Spoken answers (Decisions 23, 24, 26, 31): what to do with a number the
        // Compass voice kit heard. Kept free of the DOM so tests/ can load it.
        const AutomathSpeech = (() => {
            // The number to show in the box for what was heard (Decision 31).
            // The learner confirms it with Enter, so this only chooses what
            // they see: the last number said (they may correct themselves:
            // "seven… eight"), with a teen/ty mix-up of the answer read as
            // the answer.
            function pick(values, answer) {
                if (!Array.isArray(values) || values.length === 0) return null;
                return teenTy(values[values.length - 1], answer);
            }

            // Thirteen and thirty (up to nineteen and ninety) differ by one
