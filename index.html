                    }
                });
            }
            renderVoice();
            voiceSync();
        }

        if (voiceEngine) {
            voiceEl.classList.remove('hidden');
            const forced = urlParams.get('voice');
            let saved = null;
            try { saved = localStorage.getItem(VOICE_KEY); } catch (e) { /* storage off */ }
            voice.on = forced === '1' || (forced !== '0' && saved === '1');
            renderVoice();
            voiceBtn.addEventListener('click', () => {
                setVoice(!voice.on);
                if (!useKeypad) answerInput.focus();
            });
            answerInput.addEventListener('input', voiceTyped);
            typeBtn.addEventListener('click', () => {
                setVoice(false);
                if (!useKeypad) answerInput.focus();
            });
            voiceEnter.addEventListener('click', () => {
                checkAnswer();
                if (!useKeypad) answerInput.focus();
            });
            // The Enter key sends a heard number even when the answer box
            // does not have the focus (a click elsewhere on a computer).
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && voice.on && e.target !== answerInput
                    && !(e.target && e.target.closest && e.target.closest('button'))) checkAnswer();
            });
        }

        function newCounts() {
            return { shown: 0, answered: 0, correct: 0, fluent: 0, ms: 0 };
        }

        // A record-driven set for one operation: a check-in or a practice day.
        function planFor(op) {
            if (!factMode) return null;
            return partKinds[op] === 'checkin'
                ? AutomathFacts.planCheckin(record, op, today)
                : AutomathFacts.planSession(record, op, today);
        }

        function problemsFor(op) {
            return opState[op] && opState[op].plan ? opState[op].plan.length : totalProblems;
        }

        function beginExercise() {
            currentProblem = 0;
            correctAnswers = 0;
            pendingRetries = [];
            sessionHistory = [];
            exerciseHiddenMs = 0;
            practiceScreen.classList.add('active');
            startTime = Date.now();
            advance();
        }

        function startPractice() {
            mixedQueue = null;
            opState = { [selectedOperation]: { rules: AutomathCore.newState(), plan: planFor(selectedOperation), ...newCounts() } };
            beginExercise();
        }

        // Mixed runs: one set of every listed operation, interleaved. Each
        // operation keeps its own level, streak and trivial counts, as it would
        // on its own.
        function startMixedPractice() {
            opState = {};
            const counts = {};
            compassParts.forEach(op => {
                opState[op] = { rules: AutomathCore.newState(), plan: planFor(op), ...newCounts() };
                counts[op] = problemsFor(op);
            });
            mixedQueue = AutomathCore.buildMixedQueue(compassParts, counts);
            beginExercise();
        }

        function problemsInRun() {
            return mixedQueue ? mixedQueue.length : problemsFor(selectedOperation);
        }

        // What comes next: a missed problem that is due again, else the next
        // new problem, else any missed problem not yet retried, else the end.
        function advance() {
            const due = pendingRetries.findIndex(r => r.dueAt <= currentProblem);
            if (due >= 0) {
                showRetry(pendingRetries.splice(due, 1)[0]);
            } else if (currentProblem < problemsInRun()) {
                showNextProblem();
            } else if (pendingRetries.length > 0) {
                showRetry(pendingRetries.shift());
            } else if (mixedQueue) {
                showResults();
            } else {
                finishPart();
            }
        }

        function partLabel() {
            if (mixedQueue) return 'Mixed · ';
            return partKinds[selectedOperation] === 'checkin'
                ? `${OPERATION_NAMES[selectedOperation]} check-in · `
                : `${OPERATION_NAMES[selectedOperation]} · `;
        }

        function showNextProblem() {
            if (mixedQueue) selectedOperation = mixedQueue[currentProblem];
            const s = opState[selectedOperation];
            const problem = s.plan ? s.plan[s.shown] : AutomathCore.pickProblem(selectedOperation, s.rules);
            s.shown++;
            AutomathCore.recordShown(s.rules, problem, selectedOperation);
            currentIsRetry = false;
            displayProblem(problem);
            progressEl.textContent = `${partLabel()}Problem ${currentProblem + 1} of ${problemsInRun()}`;
        }

        // A missed problem, once more. It is not scored and does not move the
        // learner's level; it is the chance to get it right.
        function showRetry(retry) {
            selectedOperation = retry.operation;
            currentIsRetry = true;
            displayProblem(retry.problem);
            progressEl.textContent = `${partLabel()}Try this one again`;
        }

        function displayProblem(problem) {
            currentProblemData = problem;
            problemNum1El.textContent = problem.num1;
            problemOpEl.textContent = problem.operator;
            problemContainerEl.dataset.op = selectedOperation;
            problemNum2El.textContent = problem.num2;
            answerInput.value = '';
            answerInput.placeholder = '?';
            answerInput.classList.remove('correct', 'incorrect', 'corrected');
            answerMark.textContent = '';
            answerMark.classList.remove('right');
            answerInput.readOnly = false;
            answerInput.focus();
            problemShownAt = Date.now();
            problemHiddenMs = 0;
            awaitingAnswer = true;
            voiceProblemShown();
        }

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        // Right: the answer in green with a green tick. Wrong (Decision 28):
        // the learner's own answer in red with a red cross, then the right
        // answer in green with no mark, so the cross never sits beside it.
        // Returns how long the feedback takes before the next problem.
        function showFeedback(isCorrect, userAnswer) {
            const problem = currentProblemData;
            answerInput.readOnly = true;   // keys during the feedback change nothing
            if (isCorrect) {
                answerInput.value = String(problem.answer);
                answerInput.classList.add('correct');
                answerMark.textContent = '✓';
                answerMark.classList.add('right');
                return FEEDBACK_MS;
            }
            answerInput.value = String(userAnswer);
            answerInput.classList.add('incorrect');
            answerMark.textContent = '✗';
            setTimeout(() => {
                if (currentProblemData !== problem || awaitingAnswer) return;
                answerInput.classList.remove('incorrect');
                answerInput.classList.add('corrected');
                answerInput.value = String(problem.answer);
                answerMark.textContent = '';
            }, WRONG_MS);
            return WRONG_MS + CORRECTION_MS;
        }

        // A heard number in the box that the learner sends with Enter is a
        // spoken answer (Decision 31), timed from the problem appearing to the
        // number being said, so pressing Enter does not count against fluency.
        function checkAnswer() {
            if (!awaitingAnswer) return;
            const userAnswer = parseInt(answerInput.value);
            if (isNaN(userAnswer)) return;
            const spoken = voice.held && voice.held.n === userAnswer
                ? { ms: voice.held.ms, heard: voice.held.heard } : null;
            const heard = AutomathSpeech.heardNote(spoken ? spoken.heard : voice.last, userAnswer);
            awaitingAnswer = false;
            voiceAnswered();

            const ms = spoken ? spoken.ms : responseMs();
            const isCorrect = userAnswer === currentProblemData.answer;
            const wait = showFeedback(isCorrect, userAnswer);

            if (currentIsRetry) {
                setTimeout(advance, wait);
                return;
            }

            const fluent = AutomathFacts.isFluent(record, isCorrect, ms);
            const key = currentProblemData.key
                || AutomathCore.normalizeProblem(currentProblemData.num1, currentProblemData.num2, currentProblemData.operator);
            AutomathFacts.recordAnswer(record, selectedOperation, key, isCorrect, ms, today);
            sessionHistory.push({
                operation: selectedOperation,
                key: key,
                num1: currentProblemData.num1,
                num2: currentProblemData.num2,
                operator: currentProblemData.operator,
                correctAnswer: currentProblemData.answer,
                userAnswer: userAnswer,
                isCorrect: isCorrect,
                fluent: fluent,
                ms: ms,
                voice: !!spoken,
                heard: heard
            });

            const s = opState[selectedOperation];
            AutomathCore.recordAnswer(s.rules, isCorrect, fluent);
            s.answered++;
            s.ms += ms || 0;
            if (isCorrect) {
                s.correct++;
                correctAnswers++;
            }
            if (fluent) s.fluent++;
            if (!isCorrect) {
                pendingRetries.push({
                    operation: selectedOperation,
                    problem: currentProblemData,
                    dueAt: currentProblem + 1 + AutomathCore.RETRY_AFTER
                });
            }

            // Mixed runs: an operation's last problem is answered, so it is
            // finished and Compass hears about it now, not only at the end.
            if (mixedQueue && s.answered === problemsFor(selectedOperation)) finishMixedPart(selectedOperation);

            setTimeout(() => {
                currentProblem++;
                advance();
            }, wait);
        }

        // One operation's 10 problems (and their retries) are done: tell
        // Compass, then go on to the next listed operation or to the results.
        function finishPart() {
            const seconds = exerciseSeconds();
            const total = problemsFor(selectedOperation);
            reportPart({
                part: selectedOperation,
                index: listedParts.indexOf(selectedOperation) + 1,
                total,
                correct: correctAnswers,
                fluent: opState[selectedOperation].fluent,
                seconds,
                history: sessionHistory
            });
            runParts.push({ operation: selectedOperation, correct: correctAnswers, total, seconds, outcome: settleRecord(selectedOperation, sessionHistory) });
            if (partIndex < compassParts.length - 1) {
                showPartScreen();
            } else {
                showResults();
            }
        }

        // Mixed runs: one operation's 10 problems are answered. Its score and
        // time are its own problems only (time is the sum of their response
        // times, since the set interleaves them with the other operations).
        function finishMixedPart(op) {
            const s = opState[op];
            const seconds = Math.round(s.ms / 1000);
            const total = problemsFor(op);
            const history = sessionHistory.filter(item => item.operation === op);
            reportPart({
                part: op,
                index: listedParts.indexOf(op) + 1,
                total,
                correct: s.correct,
                fluent: s.fluent,
                seconds,
                history
            });
            runParts.push({ operation: op, correct: s.correct, total, seconds, outcome: settleRecord(op, history) });
        }

        // The record after one operation's set: a check-in moves its schedule
        // on (or brings the operation back), a practice day may graduate it.
        // Compass gets the whole record each time, so stopping partway keeps
        // what was learned. Returns what changed, for the screen.
        function settleRecord(op, history) {
            const outcome = AutomathFacts.finishPart(record, op, partKinds[op] || 'practice',
                history.map(item => ({ key: item.key, fluent: item.fluent })), today);
            reportState();
            return outcome;
        }

        function putReport(report) {
            const block = document.createElement('script');
            block.type = 'application/json';
            block.setAttribute('data-compass-report', '');
            block.textContent = JSON.stringify(report);
            document.body.appendChild(block);
        }

        // The fact record for Compass to keep and hand back next time
        // (`compass_state`), when each operation is next needed (`due`: today
        // for daily practice, the check-in day for a graduated operation), and
        // a summary for guides.
        function reportState() {
            const due = AutomathFacts.dueDays(record, today);
            const summary = {};
            const dueDates = {};
            OPERATIONS.forEach(op => {
                const c = AutomathFacts.counts(record, op);
                summary[op] = { mastered: c.mastered, fluent: c.fluent, learning: c.learning, unseen: c.unseen,
                    total: c.total, graduated: AutomathFacts.isGraduated(record, op) };
                dueDates[op] = AutomathFacts.isoDay(due[op]);
            });
            putReport({
                kind: 'state',
                data: AutomathFacts.encode(record),
                due: dueDates,
                summary,
                fluentMs: AutomathFacts.fluentLimit(record),
                appVersion: APP_VERSION
            });
            // Every fact's stage, for the fact chart guides and parents read
            // in Compass (Decision 32).
            putReport({ ...AutomathFacts.masteryReport(record), appVersion: APP_VERSION });
        }

        // A graduated operation with no check-in due: done today, nothing to ask.
        function reportRest(op) {
            putReport({
                kind: 'part',
                part: op,
                index: listedParts.indexOf(op) + 1,
                of: listedParts.length,
                mode: runMode,
                status: 'finished',
                rest: true,
                correct: 0,
                wrong: 0,
                fluent: 0,
                seconds: 0,
                items: [],
                appVersion: APP_VERSION
            });
        }

        function reportPart(part) {
            const report = {
                kind: 'part',
                part: part.part,
                index: part.index,
                of: compassParts.length,
                mode: runMode,
                status: 'finished',
                check: partKinds[part.part] === 'checkin' || undefined,
                correct: part.correct,
                wrong: part.total - part.correct,
                fluent: part.fluent,
                fluentMs: AutomathFacts.fluentLimit(record),
                seconds: part.seconds,
                items: part.history.map(item => ({
                    prompt: `${item.num1} ${item.operator} ${item.num2}`,
                    answer: item.userAnswer,
                    correctAnswer: item.correctAnswer,
                    correct: item.isCorrect,
                    fluent: item.fluent,
                    ms: item.ms,
                    voice: item.voice || undefined,
                    heard: item.heard,
                    outlier: item.ms != null && item.ms > AutomathCore.OUTLIER_MS
                })),
                appVersion: APP_VERSION
            };
            putReport(report);
        }

        function showPartScreen() {
            practiceScreen.classList.remove('active');
            partScreen.classList.add('active');
            voiceSync();
            const left = compassParts.slice(partIndex + 1).map(p => OPERATION_NAMES[p]);
            const part = runParts[runParts.length - 1];
            document.getElementById('partDoneTitle').textContent = `${OPERATION_NAMES[selectedOperation]} done ✓`;
            renderScore(document.getElementById('partScore'), part.correct, part.total, part.seconds);
            renderMastery(document.getElementById('partMastery'), [part]);
            celebrateIfEarned(part.correct, part.total);
            renderReview(document.getElementById('partReviewBody'), sessionHistory);
            document.getElementById('partLeft').textContent = left.length === 1 ? 'One more to go' : `${left.length} more to go`;
            nextPartBtn.textContent = `Next: ${left[0]} →`;
            // A beat before the button takes Enter, so the Enter that answered the
            // last problem cannot also skip this screen.
            nextPartBtn.disabled = true;
            setTimeout(() => {
                nextPartBtn.disabled = false;
                nextPartBtn.focus();
            }, 600);
        }

        function startNextPart() {
            if (partIndex >= compassParts.length - 1) return;
            stopFireworks();
            partIndex++;
            selectedOperation = compassParts[partIndex];
            partScreen.classList.remove('active');
            startPractice();
        }

        function formatTime(elapsed) {
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function accuracyOf(correct, total) {
            return total > 0 ? Math.round((correct / total) * 100) : 0;
        }

        // The score, accuracy and time of one exercise, as three big numbers.
        function renderScore(container, correct, total, elapsed) {
            container.innerHTML = '';
            [['Score', `${correct}/${total}`], ['Accuracy', `${accuracyOf(correct, total)}%`], ['Time', formatTime(elapsed)]]
                .forEach(([label, value]) => {
                    const item = document.createElement('div');
                    item.className = `result-item ${label.toLowerCase()}`;
                    const l = document.createElement('div');
                    l.className = 'result-label';
                    l.textContent = label;
                    const v = document.createElement('div');
                    v.className = 'result-value';
                    v.textContent = value;
                    item.append(l, v);
                    container.appendChild(item);
                });
        }

        // Every problem of one exercise: the learner's answer, and the right one where it was wrong.
        function renderReview(tbody, history) {
            tbody.innerHTML = '';
            history.forEach(item => {
                const row = document.createElement('tr');
                row.className = item.isCorrect ? 'correct' : 'incorrect';

                const problemCell = document.createElement('td');
                problemCell.className = 'problem-col';
                problemCell.textContent = `${item.num1} ${item.operator} ${item.num2} =`;
                row.appendChild(problemCell);

                const answerCell = document.createElement('td');
                answerCell.textContent = item.userAnswer;
                row.appendChild(answerCell);

                const correctCell = document.createElement('td');
                if (item.isCorrect) {
                    correctCell.innerHTML = '<span class="feedback-icon">✓</span>';
                } else {
                    correctCell.textContent = item.correctAnswer;
                    correctCell.style.color = '#333333';
                }
                row.appendChild(correctCell);

                tbody.appendChild(row);
            });
        }

        // One row per operation finished in this visit; the last one is the
        // exercise just finished.
        function renderSummary(markLast = true) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            runParts.forEach((part, i) => {
                const row = document.createElement('tr');
                if (markLast && i === runParts.length - 1) row.className = 'current';
                [OPERATION_NAMES[part.operation], `${part.correct}/${part.total}`,
                    `${accuracyOf(part.correct, part.total)}%`, formatTime(part.seconds)].forEach((text, col) => {
                    const cell = document.createElement('td');
                    cell.className = ['problem-col', 'score', 'accuracy', 'time'][col];
                    cell.textContent = text;
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });
            document.getElementById('summaryTable').classList.remove('hidden');
        }

        // One line per operation: how many of its facts are mastered, and the
        // news when it graduates or comes back from a check-in. Only with a
        // record from Compass: on a first day every count would be 0.
        function renderMastery(container, parts) {
            container.innerHTML = '';
            if (!factMode) return;
            parts.forEach(part => {
                const op = part.operation;
                const name = OPERATION_NAMES[op];
                const c = AutomathFacts.counts(record, op);
                const line = document.createElement('div');
                if (part.outcome === 'graduated') {
                    line.textContent = `${name}: all your facts are fluent! You only need a quick check-in now and then.`;
                } else if (part.outcome === 'back') {
                    line.textContent = `${name}: a few facts need practice again. They're back in your warm-up.`;
                } else if (part.outcome === 'kept') {
                    line.textContent = `${name} check-in done. Still fluent.`;
                } else {
                    line.textContent = `${name} facts mastered: ${c.mastered} of ${c.total}`;
                }
                container.appendChild(line);
            });
        }

        // Every listed operation is graduated and none has a check-in due.
        function showNothingDue() {
            resultsScreen.classList.add('active');
            document.getElementById('resultsTitle').textContent = 'Nothing due today ✓';
            document.getElementById('resultsScore').innerHTML = '';
            document.getElementById('resultsMastery').textContent = 'Your facts are fluent. See you at your next check-in.';
            document.getElementById('reviewTable').closest('.review-section').classList.add('hidden');
        }

        function showResults() {
            practiceScreen.classList.remove('active');
            resultsScreen.classList.add('active');
            voiceSync();

            // Every screen shows the exercise just finished: its own score and its
            // own problems, then a table of every exercise in this visit, one
            // score per operation.
            const part = runParts[runParts.length - 1];
            renderMastery(document.getElementById('resultsMastery'), mixedQueue ? runParts : [part]);
            if (mixedQueue) {
                // One set, so one score for it, then one row per operation so a
                // weak operation still shows.
                document.getElementById('resultsTitle').textContent = 'Mixed practice done ✓';
                renderScore(document.getElementById('resultsScore'), correctAnswers, problemsInRun(), exerciseSeconds());
                celebrateIfEarned(correctAnswers, problemsInRun());
                runParts.sort((a, b) => compassParts.indexOf(a.operation) - compassParts.indexOf(b.operation));
                renderSummary(false);
            } else {
                document.getElementById('resultsTitle').textContent = `${OPERATION_NAMES[part.operation]} done ✓`;
                renderScore(document.getElementById('resultsScore'), part.correct, part.total, part.seconds);
                celebrateIfEarned(part.correct, part.total);
                renderSummary();
            }
            renderReview(document.getElementById('reviewTableBody'), sessionHistory);
        }

        // A short burst of fireworks over the score when accuracy is above 85%:
        // a handful of rockets climb from the bottom, each pops into a ring of
        // square sparks that drift down and fade. About three seconds, no sound,
        // and nothing at all for anyone who asks their device for less motion.
        const CELEBRATE_ABOVE = 85;
        const fireworksCanvas = document.getElementById('fireworks');
        let fireworksFrame = null;
        let fireworksTimers = [];

        function celebrateIfEarned(correct, total) {
            if (total > 0 && (correct / total) * 100 > CELEBRATE_ABOVE) launchFireworks();
        }

        function stopFireworks() {
            if (fireworksFrame) cancelAnimationFrame(fireworksFrame);
            fireworksFrame = null;
            fireworksTimers.forEach(clearTimeout);
            fireworksTimers = [];
            fireworksCanvas.hidden = true;
        }

        function launchFireworks() {
            stopFireworks();
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const ctx = fireworksCanvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            fireworksCanvas.width = w * dpr;
            fireworksCanvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fireworksCanvas.hidden = false;

            const colors = ['#2563eb', '#0f766e', '#7c3aed', '#f59e0b', '#ef4444', '#22c55e'];
            const rockets = [];
            const sparks = [];
            const size = Math.max(4, Math.round(Math.min(w, h) / 120));
            const shots = 6;
            for (let i = 0; i < shots; i++) {
                fireworksTimers.push(setTimeout(() => {
                    const x = w * (0.15 + 0.7 * ((i * 0.37 + Math.random() * 0.25) % 1));
                    rockets.push({
                        x, y: h + size,
                        vy: -(h * 0.018 + Math.random() * h * 0.004),
                        burstAt: h * (0.18 + Math.random() * 0.25),
                        color: colors[i % colors.length]
                    });
                }, i * 380));
            }

            const burst = (r) => {
                const count = 28;
                const speed = Math.min(w, h) * 0.006 + Math.random() * 1.5;
                for (let k = 0; k < count * 1.5; k++) {
                    // An outer ring and a slower inner one
                    const inner = k >= count;
                    const angle = (Math.PI * 2 * k) / (inner ? count / 2 : count) + (inner ? 0.2 : 0);
                    const v = inner ? speed * 0.55 : speed;
                    sparks.push({
                        x: r.x, y: r.y,
                        vx: Math.cos(angle) * v,
                        vy: Math.sin(angle) * v,
                        life: 1,
                        color: k % 4 === 0 ? '#ffd166' : r.color
                    });
                }
            };

            const started = performance.now();
            const tick = (now) => {
                ctx.clearRect(0, 0, w, h);
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    r.y += r.vy;
                    ctx.fillStyle = r.color;
                    ctx.fillRect(r.x - size / 2, r.y, size, size);
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(r.x - size / 4, r.y + size * 1.5, size / 2, size * 2);
                    ctx.globalAlpha = 1;
                    if (r.y <= r.burstAt) {
                        burst(r);
                        rockets.splice(i, 1);
                    }
                }
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const p = sparks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.97;
                    p.vy = p.vy * 0.97 + 0.06;
                    p.life -= 0.012;
                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(Math.round(p.x), Math.round(p.y), size, size);
                }
                ctx.globalAlpha = 1;
                const launching = now - started < shots * 380;
                if (launching || rockets.length || sparks.length) {
                    fireworksFrame = requestAnimationFrame(tick);
                } else {
                    stopFireworks();
                }
            };
            fireworksFrame = requestAnimationFrame(tick);
        }

        // Start the first operation Compass listed (or all four, opened on its
        // own). Graduated operations with no check-in due are reported done first.
        restingParts.forEach(reportRest);
        if (compassParts.length === 0) {
            showNothingDue();
        } else if (runMode === 'mixed') {
            startMixedPractice();
        } else {
            selectedOperation = compassParts[0];
            startPractice();
        }
    </script>
</body>
</html>
