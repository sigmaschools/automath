<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automath - Math Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .options {
            margin-bottom: 50px;
        }

        .option-group {
            margin-bottom: 40px;
        }

        .option-group label {
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button.secondary {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        button.selected {
            background: #000000;
            color: #ffffff;
        }

        #restartBtn {
            background: #2563eb;
        }

        #restartBtn:hover {
            background: #1d4ed8;
            opacity: 1;
        }

        .problem-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px 0;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .problem {
            font-size: 72px;
            font-weight: 300;
            line-height: 1.2;
            width: 100%;
            position: relative;
        }

        .problem-line-1 {
            text-align: right;
            padding-right: 60px;
        }

        .problem-line-2 {
            text-align: right;
            padding-right: 60px;
            position: relative;
        }

        .problem-operator {
            position: absolute;
            left: 0;
            width: 50px;
            text-align: left;
        }


        .input-container {
            width: 100%;
            position: relative;
        }

        /* The red cross beside the right answer after a miss (Decision 18) */
        .answer-mark {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            color: #ef4444;
            pointer-events: none;
        }

        input[type="number"] {
            font-size: 72px;
            padding: 15px 20px;
            padding-right: 60px;
            border: none;
            border-top: 3px solid #000000;
            border-radius: 0;
            width: 100%;
            text-align: right;
            font-family: inherit;
            transition: background-color 0.2s, border-color 0.2s;
            box-sizing: border-box;
            background-color: #f5f5f5;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* Hide the browser's up/down spinner arrows on the answer field */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            outline: none;
            border-top-color: #000000;
        }

        input[type="number"].correct {
            background-color: #e8f5e9;
            border-top-color: #22c55e;
            color: #22c55e;
            caret-color: transparent;
        }

        input[type="number"].incorrect {
            background-color: #ffebee;
            border-top-color: #ef4444;
            color: #ef4444;
            caret-color: transparent;
        }

        /* After a miss: the right answer, in dark text on the red box */
        input[type="number"].corrected {
            background-color: #ffebee;
            border-top-color: #ef4444;
            caret-color: transparent;
        }

        input[type="number"].corrected::placeholder {
            color: #111111;
        }

        input[type="number"]::placeholder {
            font-size: 72px;
            color: #cccccc;
        }

        input[type="number"].correct::placeholder {
            color: #22c55e;
        }

        input[type="number"].incorrect::placeholder {
            color: #ef4444;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        .results {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .result-item {
            margin: 0;
        }

        .result-value {
            font-size: 56px;
            font-weight: 300;
            margin-top: 10px;
        }

        .result-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-section {
            margin-top: 40px;
            padding-top: 0;
        }

        .review-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 24px;
            color: #333333;
        }

        .review-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: 400;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .review-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .review-table tr.correct {
            background-color: #ffffff;
        }

        .review-table tr.incorrect {
            background-color: #ffebee;
            color: #ef4444;
        }

        .review-table .problem-col {
            text-align: left;
            padding-left: 20px;
        }

        .review-table .feedback-icon {
            font-size: 20px;
            color: #22c55e;
        }

        .review-table .feedback-icon.incorrect {
            color: #ef4444;
        }

        .hidden {
            display: none;
        }

        .part-left {
            font-size: 18px;
            color: #666666;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .summary-table {
            margin-top: 30px;
        }

        .summary-table tr.current {
            font-weight: 500;
        }

        /* Each number on a score screen has its own color, so the three values
           read apart at a glance. The same colors mark the summary columns. */
        .result-item.score .result-value, .summary-table td.score { color: #2563eb; }
        .result-item.accuracy .result-value, .summary-table td.accuracy { color: #0f766e; }
        .result-item.time .result-value, .summary-table td.time { color: #7c3aed; }
        .result-item.score .result-label { color: #2563eb; }
        .result-item.accuracy .result-label { color: #0f766e; }
        .result-item.time .result-label { color: #7c3aed; }
        .result-item .result-label { font-weight: 600; }

        /* The one way forward between exercises: big, colored and right under
           the title, so nobody has to hunt for it. */
        #nextPartBtn {
            display: block;
            margin: 32px auto 8px auto;
            background: #2563eb;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            padding: 22px 56px;
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        #nextPartBtn:hover {
            background: #1d4ed8;
            opacity: 1;
        }

        #nextPartBtn:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #nextPartBtn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        .next-hint {
            font-size: 14px;
            color: #737373;
            margin-bottom: 10px;
        }

        /* On-screen number pad for touch screens (Decision 18) */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 320px;
            margin: 0 auto;
        }

        .keypad.hidden {
            display: none;
        }

        .keypad button {
            background: #f5f5f5;
            color: #000000;
            border: 1px solid #dddddd;
            border-radius: 10px;
            font-size: 30px;
            height: 64px;
            padding: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .keypad button:active {
            background: #e5e5e5;
        }

        .keypad button.key-enter {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
        }

        body.with-keypad .problem-container {
            margin: 20px auto 20px auto;
        }

        /* Fireworks over a score above 85% (Decision 17). Clicks pass through. */
        #fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Automath</h1>

            <div class="options">
                <div class="option-group">
                    <label>Operation</label>
                    <div class="button-group">
                        <button class="secondary operation-btn" data-operation="addition">Addition</button>
                        <button class="secondary operation-btn" data-operation="subtraction">Subtraction</button>
                        <button class="secondary operation-btn" data-operation="multiplication">Multiplication</button>
                        <button class="secondary operation-btn" data-operation="division">Division</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practiceScreen" class="screen">
            <div class="problem-container">
                <div class="problem">
                    <div class="problem-line-1" id="problemNum1"></div>
                    <div class="problem-line-2">
                        <span class="problem-operator" id="problemOp"></span>
                        <span id="problemNum2"></span>
                    </div>
                </div>
                <div class="input-container">
                    <input type="number" id="answer" placeholder="?" autocomplete="off">
                    <span class="answer-mark" id="answerMark" aria-hidden="true"></span>
                </div>
            </div>

            <div class="keypad hidden" id="keypad">
                <button type="button" data-key="1">1</button>
                <button type="button" data-key="2">2</button>
                <button type="button" data-key="3">3</button>
                <button type="button" data-key="4">4</button>
                <button type="button" data-key="5">5</button>
                <button type="button" data-key="6">6</button>
                <button type="button" data-key="7">7</button>
                <button type="button" data-key="8">8</button>
                <button type="button" data-key="9">9</button>
                <button type="button" data-key="back" aria-label="Delete">⌫</button>
                <button type="button" data-key="0">0</button>
                <button type="button" data-key="enter" class="key-enter">Enter</button>
            </div>

            <div class="progress" id="progress">Problem 1 of 15</div>
        </div>

        <!-- Between parts (only when Compass chose the operations) -->
        <div id="partScreen" class="screen">
            <h2 id="partDoneTitle">Done</h2>
            <div class="results" id="partScore"></div>
            <button id="nextPartBtn">Next</button>
            <div class="next-hint">or press Enter</div>
            <div class="part-left" id="partLeft"></div>
            <div class="review-section">
                <div class="review-title">Review Your Work</div>
                <table class="review-table">
                    <thead>
                        <tr>
                            <th class="problem-col">Problem</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                        </tr>
                    </thead>
                    <tbody id="partReviewBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <h2 id="resultsTitle">Complete</h2>

            <div class="results" id="resultsScore">
                <div class="result-item score">
                    <div class="result-label">Score</div>
                    <div class="result-value" id="scoreResult">0/10</div>
                </div>

                <div class="result-item accuracy">
                    <div class="result-label">Accuracy</div>
                    <div class="result-value" id="accuracyResult">0%</div>
                </div>

                <div class="result-item time">
                    <div class="result-label">Time</div>
                    <div class="result-value" id="timeResult">0:00</div>
                </div>
            </div>

            <!-- Compass runs: one row per operation in this visit -->
            <table class="review-table summary-table hidden" id="summaryTable">
                <thead>
                    <tr>
                        <th class="problem-col">Exercise</th>
                        <th>Score</th>
                        <th>Accuracy</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="summaryTableBody"></tbody>
            </table>

            <button id="restartBtn" style="margin-top: 40px; margin-bottom: 0;">Practice Again</button>

            <div class="review-section">
                <div class="review-title">Review Your Work</div>
                <table class="review-table" id="reviewTable">
                    <thead>
                        <tr>
                            <th class="problem-col">Problem</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <canvas id="fireworks" hidden></canvas>

    <!-- The practice rules, with no page code: which problems each level holds,
         how the next one is picked, when a learner moves up or down, and what
         counts as fluent. tests/ loads this block on its own (Node, no browser),
         so keep it free of the DOM. -->
    <script id="automath-core">
        const AutomathCore = (() => {
            // A correct answer is fluent when it comes within this many ms
            // (Decision 18). Never shown to the learner; it decides levelling up
            // and is reported to Compass.
            const FLUENT_MS = { addition: 3000, subtraction: 3000, multiplication: 3000, division: 3000 };
            // An answer that took longer than this is flagged in the report: the
            // learner most likely stopped, so its time says little about recall.
            const OUTLIER_MS = 30000;
            // A missed problem comes back once, after this many other problems.
            const RETRY_AFTER = 3;

            function isTrivial(num1, num2, operation) {
                if (operation === 'multiplication') return num2 === 0 || num2 === 1;
                if (operation === 'division') return num2 === 1;
                if (operation === 'addition') return num2 === 0;
                if (operation === 'subtraction') return num2 === 0;
                return false;
            }

            // 7 × 2 and 2 × 7 are the same fact; 7 − 2 and 2 − 7 are not.
            function normalizeProblem(num1, num2, operator) {
                if (operator === '+' || operator === '×') {
                    return `${Math.min(num1, num2)},${Math.max(num1, num2)},${operator}`;
                }
                return `${num1},${num2},${operator}`;
            }

            // Every problem a level can give, listed once. Every level is a set
            // of facts (Decision 18): level 4 of addition and subtraction is the
            // facts that cross ten, not two-digit sums.
            const poolCache = {};
            function problemsAt(operation, level) {
                const key = `${operation}${level}`;
                if (poolCache[key]) return poolCache[key];
                const list = [];
                const add = (num1, num2, operator, answer) => list.push({ num1, num2, operator, answer });
                const pairs = (aFrom, aTo, bFrom, bTo, make) => {
                    for (let a = aFrom; a <= aTo; a++) {
                        const from = typeof bFrom === 'function' ? bFrom(a) : bFrom;
                        const to = typeof bTo === 'function' ? bTo(a) : bTo;
                        for (let b = from; b <= to; b++) make(a, b);
                    }
                };
                switch (operation) {
                    case 'addition': {
                        const plus = (a, b) => add(a, b, '+', a + b);
                        if (level === 1) pairs(1, 4, 1, a => 5 - a, plus);                    // within 5
                        else if (level === 2) pairs(1, 9, 1, a => 10 - a, plus);              // within 10
                        else if (level === 3) pairs(5, 19, 1, a => Math.min(10, 20 - a), plus); // within 20
                        else pairs(2, 9, a => Math.max(2, 11 - a), 9, plus);                  // crossing ten: 8 + 7
                        break;
                    }
                    case 'subtraction': {
                        const minus = (a, b) => add(a, b, '−', a - b);
                        if (level === 1) pairs(2, 5, 1, a => a - 1, minus);                       // within 5
                        else if (level === 2) pairs(3, 10, 1, a => a - 1, minus);                 // within 10
                        else if (level === 3) pairs(6, 20, 1, a => Math.min(10, a - 1), minus);   // within 20
                        else pairs(11, 18, a => Math.max(2, a - 9), 9, minus);                    // crossing ten: 13 − 6
                        break;
                    }
                    case 'multiplication': {
                        const times = (a, b) => add(a, b, '×', a * b);
                        const [aTo, bTo] = [[10, 2], [10, 5], [10, 10], [12, 12]][level - 1];
                        pairs(1, aTo, 0, bTo, times);
                        break;
                    }
                    case 'division': {
                        const over = (b, q) => add(b * q, b, '÷', q);
                        const [bFrom, bTo, qTo] = [[1, 2, 10], [1, 5, 10], [2, 10, 12], [2, 12, 12]][level - 1];
                        pairs(bFrom, bTo, 1, qTo, over);
                        break;
                    }
                }
                poolCache[key] = list;
                return list;
            }

            // One operation's practice state within an exercise.
            function newState() {
                return {
                    level: 1,
                    streak: 0,          // fluent correct answers in a row
                    droppedFrom: [],    // levels slipped out of this exercise
                    seen: new Set(),    // normalized problems already shown
                    consecutiveTrivial: 0,
                    totalTrivial: 0,
                    recentOperands: []  // the numbers of the last two problems
                };
            }

            // The next problem: never one already seen (7 × 2 and 2 × 7 count as
            // one). Each unseen problem gets a cost: 1 if it uses a number from the
            // last two problems, 3 if it breaks the trivial limits (two ×0/×1-type
            // problems in a row, or more than 3), and 2.5 for each level it is away
            // from the learner's level (a little more going down than up). The
            // cheapest is picked, at random among equals. So the soft rules give
            // way before the level does, except that a trivial problem the limits
            // forbid is swapped for a fresh one from the next level: a learner who
            // stays on level 1 a long time gets ×3 facts, not a run of ×0 and ×1.
            function pickProblem(operation, s, rand = Math.random) {
                let best = [];
                let bestCost = Infinity;
                for (let l = 1; l <= 4; l++) {
                    const away = l >= s.level ? (l - s.level) * 2.5 : (s.level - l) * 2.6;
                    if (away > bestCost) continue;
                    problemsAt(operation, l).forEach(p => {
                        if (s.seen.has(normalizeProblem(p.num1, p.num2, p.operator))) return;
                        const trivial = isTrivial(p.num1, p.num2, operation);
                        const cost = away
                            + (trivial && (s.consecutiveTrivial >= 1 || s.totalTrivial >= 3) ? 3 : 0)
                            + (s.recentOperands.includes(p.num1) || s.recentOperands.includes(p.num2) ? 1 : 0);
                        if (cost < bestCost) {
                            bestCost = cost;
                            best = [];
                        }
                        if (cost === bestCost) best.push(p);
                    });
                }
                if (best.length > 0) return best[Math.floor(rand() * best.length)];
                // Every problem of this operation has been seen (cannot happen in
                // 15 problems, but never get stuck): repeat one at this level.
                const pool = problemsAt(operation, s.level);
                return pool[Math.floor(rand() * pool.length)];
            }

            function recordShown(s, problem, operation) {
                s.seen.add(normalizeProblem(problem.num1, problem.num2, problem.operator));
                if (isTrivial(problem.num1, problem.num2, operation)) {
                    s.consecutiveTrivial++;
                    s.totalTrivial++;
                } else {
                    s.consecutiveTrivial = 0;
                }
                s.recentOperands = [...s.recentOperands, problem.num1, problem.num2].slice(-4);
            }

            function isFluent(operation, correct, ms) {
                return correct && ms != null && ms <= FLUENT_MS[operation];
            }

            // Moving between levels (Decisions 17 and 18): up after 2 fluent
            // correct answers in a row (3 to go back into a level slipped out of
            // this exercise); down one on any wrong answer. A correct but slow
            // answer neither builds nor breaks the streak: the fact is known but
            // not yet automatic, so the learner stays at this level.
            function recordAnswer(s, correct, fluent) {
                if (!correct) {
                    s.streak = 0;
                    if (s.level > 1) {
                        if (!s.droppedFrom.includes(s.level)) s.droppedFrom.push(s.level);
                        s.level--;
                    }
                    return;
                }
                if (!fluent) return;
                s.streak++;
                const needed = s.droppedFrom.includes(s.level + 1) ? 3 : 2;
                if (s.streak >= needed && s.level < 4) {
                    s.level++;
                    s.streak = 0;
                }
            }

            // Mixed runs: `rounds` rounds, each with every operation once in a
            // random order, never the same operation twice in a row.
            function buildMixedQueue(parts, rounds, rand = Math.random) {
                const queue = [];
                for (let round = 0; round < rounds; round++) {
                    let order;
                    do {
                        order = [...parts];
                        for (let i = order.length - 1; i > 0; i--) {
                            const j = Math.floor(rand() * (i + 1));
                            [order[i], order[j]] = [order[j], order[i]];
                        }
                    } while (parts.length > 1 && queue.length > 0 && order[0] === queue[queue.length - 1]);
                    queue.push(...order);
                }
                return queue;
            }

            return {
                FLUENT_MS, OUTLIER_MS, RETRY_AFTER,
                isTrivial, normalizeProblem, problemsAt, newState, pickProblem,
                recordShown, isFluent, recordAnswer, buildMixedQueue
            };
        })();
    </script>
    <script>
        // Compass support (app contract 0.1): `compass_parts` in the URL lists the
        // operations to run, with no picker; each finished operation is reported
        // in a data-compass-report block; the results screen comes after the last
        // one. On alternate days the operations are interleaved in one set
        // (`runMode` below). Without the parameter the app works exactly as before.
        // The practice rules themselves live in AutomathCore, above.
        const APP_VERSION = '1.5.0';
        const OPERATIONS = ['addition', 'subtraction', 'multiplication', 'division'];
        const OPERATION_NAMES = { addition: 'Addition', subtraction: 'Subtraction', multiplication: 'Multiplication', division: 'Division' };
        const FEEDBACK_MS = 400;     // a tick or a cross, then the next problem
        const CORRECTION_MS = 1500;  // after a miss: the right answer stays this long
        const urlParams = (() => {
            try { return new URLSearchParams(window.location.search); } catch (e) { return new URLSearchParams(); }
        })();
        const compassParts = (() => {
            const value = urlParams.get('compass_parts');
            if (!value) return null;
            const parts = [...new Set(value.split(',').map(p => p.trim().toLowerCase()).filter(p => OPERATIONS.includes(p)))];
            return parts.length > 0 ? parts : null;
        })();
        // How a Compass run of two or more operations is laid out: `grouped` runs
        // them one after another (15 problems each); `mixed` interleaves them in
        // one set (15 of each, every operation once per round in a random order,
        // never the same operation twice in a row). The two alternate by the
        // learner's local day: even days mixed, odd days grouped. `mode=mixed` or
        // `mode=grouped` in the URL forces one (for testing).
        const runMode = (() => {
            if (!compassParts || compassParts.length < 2) return 'grouped';
            const forced = urlParams.get('mode');
            if (forced === 'mixed' || forced === 'grouped') return forced;
            const now = new Date();
            const localDay = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
            return localDay % 2 === 0 ? 'mixed' : 'grouped';
        })();
        // A number pad on the page for touch screens, so the device keyboard does
        // not cover the problem and typing time does not count as recall time.
        // `keypad=1` or `keypad=0` in the URL forces it on or off (for testing).
        const useKeypad = (() => {
            const forced = urlParams.get('keypad');
            if (forced === '1') return true;
            if (forced === '0') return false;
            return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        })();

        let partIndex = 0;
        let runParts = [];      // one score per finished operation in this visit
        let mixedQueue = null;  // mixed runs: the operation of each problem, in order
        let opState = {};       // each operation's rules state (AutomathCore.newState) and counts

        let selectedOperation = null;
        let currentProblem = 0; // scored problems answered so far in this exercise
        const totalProblems = 15;
        let correctAnswers = 0;
        let startTime = null;
        let currentProblemData = null;
        let currentIsRetry = false;
        let awaitingAnswer = false;
        let pendingRetries = [];  // missed problems still to come back once
        let sessionHistory = [];  // every scored problem and answer, for review and the report

        // Response time counts only while the page is visible: a learner who
        // switches away and back is not timed for the break.
        let problemShownAt = null;
        let problemHiddenMs = 0;
        let exerciseHiddenMs = 0;
        let hiddenSince = null;
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                hiddenSince = Date.now();
            } else if (hiddenSince !== null) {
                const away = Date.now() - hiddenSince;
                problemHiddenMs += away;
                exerciseHiddenMs += away;
                hiddenSince = null;
            }
        });
        function hiddenNow() {
            return hiddenSince !== null ? Date.now() - hiddenSince : 0;
        }
        function responseMs() {
            return problemShownAt ? Math.max(0, Date.now() - problemShownAt - problemHiddenMs - hiddenNow()) : null;
        }
        function exerciseSeconds() {
            return Math.round(Math.max(0, Date.now() - startTime - exerciseHiddenMs - hiddenNow()) / 1000);
        }

        // Elements
        const startScreen = document.getElementById('startScreen');
        const practiceScreen = document.getElementById('practiceScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const restartBtn = document.getElementById('restartBtn');
        const problemNum1El = document.getElementById('problemNum1');
        const problemNum2El = document.getElementById('problemNum2');
        const problemOpEl = document.getElementById('problemOp');
        const answerInput = document.getElementById('answer');
        const answerMark = document.getElementById('answerMark');
        const progressEl = document.getElementById('progress');
        const keypad = document.getElementById('keypad');

        // Operation buttons - start practice immediately when clicked
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedOperation = btn.dataset.operation;
                startPractice();
            });
        });

        restartBtn.addEventListener('click', resetApp);

        const partScreen = document.getElementById('partScreen');
        const nextPartBtn = document.getElementById('nextPartBtn');
        nextPartBtn.addEventListener('click', startNextPart);

        if (useKeypad) {
            document.body.classList.add('with-keypad');
            keypad.classList.remove('hidden');
            answerInput.setAttribute('inputmode', 'none');
            keypad.addEventListener('click', (e) => {
                const key = e.target.closest('button')?.dataset.key;
                if (!key || !awaitingAnswer) return;
                if (key === 'enter') {
                    checkAnswer();
                } else if (key === 'back') {
                    answerInput.value = answerInput.value.slice(0, -1);
                } else if (answerInput.value.length < 3) {
                    answerInput.value += key;
                }
                if (key !== 'enter') answerInput.focus();
            });
        }

        function newCounts() {
            return { answered: 0, correct: 0, fluent: 0, ms: 0 };
        }

        function beginExercise() {
            currentProblem = 0;
            correctAnswers = 0;
            pendingRetries = [];
            sessionHistory = [];
            exerciseHiddenMs = 0;
            startScreen.classList.remove('active');
            practiceScreen.classList.add('active');
            startTime = Date.now();
            advance();
        }

        function startPractice() {
            mixedQueue = null;
            opState = { [selectedOperation]: { rules: AutomathCore.newState(), ...newCounts() } };
            beginExercise();
        }

        // Mixed runs: one set of every listed operation, interleaved. Each
        // operation keeps its own level, streak and trivial counts, as it would
        // on its own.
        function startMixedPractice() {
            mixedQueue = AutomathCore.buildMixedQueue(compassParts, totalProblems);
            opState = {};
            compassParts.forEach(op => {
                opState[op] = { rules: AutomathCore.newState(), ...newCounts() };
            });
            beginExercise();
        }

        function problemsInRun() {
            return mixedQueue ? mixedQueue.length : totalProblems;
        }

        // What comes next: a missed problem that is due again, else the next
        // new problem, else any missed problem not yet retried, else the end.
        function advance() {
            const due = pendingRetries.findIndex(r => r.dueAt <= currentProblem);
            if (due >= 0) {
                showRetry(pendingRetries.splice(due, 1)[0]);
            } else if (currentProblem < problemsInRun()) {
                showNextProblem();
            } else if (pendingRetries.length > 0) {
                showRetry(pendingRetries.shift());
            } else if (mixedQueue) {
                showResults();
            } else {
                finishPart();
            }
        }

        function partLabel() {
            return mixedQueue ? 'Mixed · ' : compassParts ? `${OPERATION_NAMES[selectedOperation]} · ` : '';
        }

        function showNextProblem() {
            if (mixedQueue) selectedOperation = mixedQueue[currentProblem];
            const rules = opState[selectedOperation].rules;
            const problem = AutomathCore.pickProblem(selectedOperation, rules);
            AutomathCore.recordShown(rules, problem, selectedOperation);
            currentIsRetry = false;
            displayProblem(problem);
            progressEl.textContent = `${partLabel()}Problem ${currentProblem + 1} of ${problemsInRun()}`;
        }

        // A missed problem, once more. It is not scored and does not move the
        // learner's level; it is the chance to get it right.
        function showRetry(retry) {
            selectedOperation = retry.operation;
            currentIsRetry = true;
            displayProblem(retry.problem);
            progressEl.textContent = `${partLabel()}Try this one again`;
        }

        function displayProblem(problem) {
            currentProblemData = problem;
            problemNum1El.textContent = problem.num1;
            problemOpEl.textContent = problem.operator;
            problemNum2El.textContent = problem.num2;
            answerInput.value = '';
            answerInput.placeholder = '?';
            answerInput.classList.remove('correct', 'incorrect', 'corrected');
            answerMark.textContent = '';
            answerInput.focus();
            problemShownAt = Date.now();
            problemHiddenMs = 0;
            awaitingAnswer = true;
        }

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });

        function showFeedback(isCorrect) {
            answerInput.value = '';
            if (isCorrect) {
                answerInput.placeholder = '✓';
                answerInput.classList.add('correct');
            } else {
                // The right answer, in the box, with a red cross beside it.
                answerInput.placeholder = String(currentProblemData.answer);
                answerInput.classList.add('corrected');
                answerMark.textContent = '✗';
            }
        }

        function checkAnswer() {
            if (!awaitingAnswer) return;
            const userAnswer = parseInt(answerInput.value);
            if (isNaN(userAnswer)) return;
            awaitingAnswer = false;

            const ms = responseMs();
            const isCorrect = userAnswer === currentProblemData.answer;
            showFeedback(isCorrect);
            const wait = isCorrect ? FEEDBACK_MS : CORRECTION_MS;

            if (currentIsRetry) {
                setTimeout(advance, wait);
                return;
            }

            const fluent = AutomathCore.isFluent(selectedOperation, isCorrect, ms);
            sessionHistory.push({
                operation: selectedOperation,
                num1: currentProblemData.num1,
                num2: currentProblemData.num2,
                operator: currentProblemData.operator,
                correctAnswer: currentProblemData.answer,
                userAnswer: userAnswer,
                isCorrect: isCorrect,
                fluent: fluent,
                ms: ms
            });

            const s = opState[selectedOperation];
            AutomathCore.recordAnswer(s.rules, isCorrect, fluent);
            s.answered++;
            s.ms += ms || 0;
            if (isCorrect) {
                s.correct++;
                correctAnswers++;
            }
            if (fluent) s.fluent++;
            if (!isCorrect) {
                pendingRetries.push({
                    operation: selectedOperation,
                    problem: currentProblemData,
                    dueAt: currentProblem + 1 + AutomathCore.RETRY_AFTER
                });
            }

            // Mixed runs: an operation's last problem is answered, so it is
            // finished and Compass hears about it now, not only at the end.
            if (mixedQueue && s.answered === totalProblems) finishMixedPart(selectedOperation);

            setTimeout(() => {
                currentProblem++;
                advance();
            }, wait);
        }

        // One operation's 15 problems (and their retries) are done: tell
        // Compass, then go on to the next listed operation or to the results.
        function finishPart() {
            const seconds = exerciseSeconds();
            reportPart({
                part: selectedOperation,
                index: compassParts ? partIndex + 1 : 1,
                correct: correctAnswers,
                fluent: opState[selectedOperation].fluent,
                seconds,
                history: sessionHistory
            });
            runParts.push({ operation: selectedOperation, correct: correctAnswers, total: totalProblems, seconds });
            if (compassParts && partIndex < compassParts.length - 1) {
                showPartScreen();
            } else {
                showResults();
            }
        }

        // Mixed runs: one operation's 15 problems are answered. Its score and
        // time are its own problems only (time is the sum of their response
        // times, since the set interleaves them with the other operations).
        function finishMixedPart(op) {
            const s = opState[op];
            const seconds = Math.round(s.ms / 1000);
            reportPart({
                part: op,
                index: compassParts.indexOf(op) + 1,
                correct: s.correct,
                fluent: s.fluent,
                seconds,
                history: sessionHistory.filter(item => item.operation === op)
            });
            runParts.push({ operation: op, correct: s.correct, total: totalProblems, seconds });
        }

        function reportPart(part) {
            const report = {
                kind: 'part',
                part: part.part,
                index: part.index,
                of: compassParts ? compassParts.length : 1,
                mode: runMode,
                status: 'finished',
                correct: part.correct,
                wrong: totalProblems - part.correct,
                fluent: part.fluent,
                fluentMs: AutomathCore.FLUENT_MS[part.part],
                seconds: part.seconds,
                items: part.history.map(item => ({
                    prompt: `${item.num1} ${item.operator} ${item.num2}`,
                    answer: item.userAnswer,
                    correctAnswer: item.correctAnswer,
                    correct: item.isCorrect,
                    fluent: item.fluent,
                    ms: item.ms,
                    outlier: item.ms != null && item.ms > AutomathCore.OUTLIER_MS
                })),
                appVersion: APP_VERSION
            };
            const block = document.createElement('script');
            block.type = 'application/json';
            block.setAttribute('data-compass-report', '');
            block.textContent = JSON.stringify(report);
            document.body.appendChild(block);
        }

        function showPartScreen() {
            practiceScreen.classList.remove('active');
            partScreen.classList.add('active');
            const left = compassParts.slice(partIndex + 1).map(p => OPERATION_NAMES[p]);
            const part = runParts[runParts.length - 1];
            document.getElementById('partDoneTitle').textContent = `${OPERATION_NAMES[selectedOperation]} done ✓`;
            renderScore(document.getElementById('partScore'), part.correct, part.total, part.seconds);
            celebrateIfEarned(part.correct, part.total);
            renderReview(document.getElementById('partReviewBody'), sessionHistory);
            document.getElementById('partLeft').textContent = left.length === 1 ? 'One more to go' : `${left.length} more to go`;
            nextPartBtn.textContent = `Next: ${left[0]} →`;
            // A beat before the button takes Enter, so the Enter that answered the
            // last problem cannot also skip this screen.
            nextPartBtn.disabled = true;
            setTimeout(() => {
                nextPartBtn.disabled = false;
                nextPartBtn.focus();
            }, 600);
        }

        function startNextPart() {
            if (!compassParts || partIndex >= compassParts.length - 1) return;
            stopFireworks();
            partIndex++;
            selectedOperation = compassParts[partIndex];
            partScreen.classList.remove('active');
            startPractice();
        }

        function formatTime(elapsed) {
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function accuracyOf(correct, total) {
            return total > 0 ? Math.round((correct / total) * 100) : 0;
        }

        // The score, accuracy and time of one exercise, as three big numbers.
        function renderScore(container, correct, total, elapsed) {
            container.innerHTML = '';
            [['Score', `${correct}/${total}`], ['Accuracy', `${accuracyOf(correct, total)}%`], ['Time', formatTime(elapsed)]]
                .forEach(([label, value]) => {
                    const item = document.createElement('div');
                    item.className = `result-item ${label.toLowerCase()}`;
                    const l = document.createElement('div');
                    l.className = 'result-label';
                    l.textContent = label;
                    const v = document.createElement('div');
                    v.className = 'result-value';
                    v.textContent = value;
                    item.append(l, v);
                    container.appendChild(item);
                });
        }

        // Every problem of one exercise: the learner's answer, and the right one where it was wrong.
        function renderReview(tbody, history) {
            tbody.innerHTML = '';
            history.forEach(item => {
                const row = document.createElement('tr');
                row.className = item.isCorrect ? 'correct' : 'incorrect';

                const problemCell = document.createElement('td');
                problemCell.className = 'problem-col';
                problemCell.textContent = `${item.num1} ${item.operator} ${item.num2} =`;
                row.appendChild(problemCell);

                const answerCell = document.createElement('td');
                answerCell.textContent = item.userAnswer;
                row.appendChild(answerCell);

                const correctCell = document.createElement('td');
                if (item.isCorrect) {
                    correctCell.innerHTML = '<span class="feedback-icon">✓</span>';
                } else {
                    correctCell.textContent = item.correctAnswer;
                    correctCell.style.color = '#333333';
                }
                row.appendChild(correctCell);

                tbody.appendChild(row);
            });
        }

        // One row per operation finished in this visit; the last one is the
        // exercise just finished.
        function renderSummary(markLast = true) {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            runParts.forEach((part, i) => {
                const row = document.createElement('tr');
                if (markLast && i === runParts.length - 1) row.className = 'current';
                [OPERATION_NAMES[part.operation], `${part.correct}/${part.total}`,
                    `${accuracyOf(part.correct, part.total)}%`, formatTime(part.seconds)].forEach((text, col) => {
                    const cell = document.createElement('td');
                    cell.className = ['problem-col', 'score', 'accuracy', 'time'][col];
                    cell.textContent = text;
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });
            document.getElementById('summaryTable').classList.remove('hidden');
        }

        function showResults() {
            practiceScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            // Every screen shows the exercise just finished: its own score and its
            // own problems. In Compass mode a table of every exercise in this
            // visit follows, one score per operation.
            const part = runParts[runParts.length - 1];
            if (mixedQueue) {
                // One set, so one score for it, then one row per operation so a
                // weak operation still shows.
                restartBtn.classList.add('hidden');
                document.getElementById('resultsTitle').textContent = 'Mixed practice done ✓';
                renderScore(document.getElementById('resultsScore'), correctAnswers, problemsInRun(), exerciseSeconds());
                celebrateIfEarned(correctAnswers, problemsInRun());
                runParts.sort((a, b) => compassParts.indexOf(a.operation) - compassParts.indexOf(b.operation));
                renderSummary(false);
            } else if (compassParts) {
                restartBtn.classList.add('hidden');
                document.getElementById('resultsTitle').textContent = `${OPERATION_NAMES[part.operation]} done ✓`;
                renderScore(document.getElementById('resultsScore'), part.correct, part.total, part.seconds);
                celebrateIfEarned(part.correct, part.total);
                renderSummary();
            } else {
                renderScore(document.getElementById('resultsScore'), part.correct, part.total, part.seconds);
                celebrateIfEarned(part.correct, part.total);
            }
            renderReview(document.getElementById('reviewTableBody'), sessionHistory);
        }

        // A short burst of fireworks over the score when accuracy is above 85%:
        // a handful of rockets climb from the bottom, each pops into a ring of
        // square sparks that drift down and fade. About three seconds, no sound,
        // and nothing at all for anyone who asks their device for less motion.
        const CELEBRATE_ABOVE = 85;
        const fireworksCanvas = document.getElementById('fireworks');
        let fireworksFrame = null;
        let fireworksTimers = [];

        function celebrateIfEarned(correct, total) {
            if (total > 0 && (correct / total) * 100 > CELEBRATE_ABOVE) launchFireworks();
        }

        function stopFireworks() {
            if (fireworksFrame) cancelAnimationFrame(fireworksFrame);
            fireworksFrame = null;
            fireworksTimers.forEach(clearTimeout);
            fireworksTimers = [];
            fireworksCanvas.hidden = true;
        }

        function launchFireworks() {
            stopFireworks();
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const ctx = fireworksCanvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            fireworksCanvas.width = w * dpr;
            fireworksCanvas.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fireworksCanvas.hidden = false;

            const colors = ['#2563eb', '#0f766e', '#7c3aed', '#f59e0b', '#ef4444', '#22c55e'];
            const rockets = [];
            const sparks = [];
            const size = Math.max(4, Math.round(Math.min(w, h) / 120));
            const shots = 6;
            for (let i = 0; i < shots; i++) {
                fireworksTimers.push(setTimeout(() => {
                    const x = w * (0.15 + 0.7 * ((i * 0.37 + Math.random() * 0.25) % 1));
                    rockets.push({
                        x, y: h + size,
                        vy: -(h * 0.018 + Math.random() * h * 0.004),
                        burstAt: h * (0.18 + Math.random() * 0.25),
                        color: colors[i % colors.length]
                    });
                }, i * 380));
            }

            const burst = (r) => {
                const count = 28;
                const speed = Math.min(w, h) * 0.006 + Math.random() * 1.5;
                for (let k = 0; k < count * 1.5; k++) {
                    // An outer ring and a slower inner one
                    const inner = k >= count;
                    const angle = (Math.PI * 2 * k) / (inner ? count / 2 : count) + (inner ? 0.2 : 0);
                    const v = inner ? speed * 0.55 : speed;
                    sparks.push({
                        x: r.x, y: r.y,
                        vx: Math.cos(angle) * v,
                        vy: Math.sin(angle) * v,
                        life: 1,
                        color: k % 4 === 0 ? '#ffd166' : r.color
                    });
                }
            };

            const started = performance.now();
            const tick = (now) => {
                ctx.clearRect(0, 0, w, h);
                for (let i = rockets.length - 1; i >= 0; i--) {
                    const r = rockets[i];
                    r.y += r.vy;
                    ctx.fillStyle = r.color;
                    ctx.fillRect(r.x - size / 2, r.y, size, size);
                    ctx.globalAlpha = 0.4;
                    ctx.fillRect(r.x - size / 4, r.y + size * 1.5, size / 2, size * 2);
                    ctx.globalAlpha = 1;
                    if (r.y <= r.burstAt) {
                        burst(r);
                        rockets.splice(i, 1);
                    }
                }
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const p = sparks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.97;
                    p.vy = p.vy * 0.97 + 0.06;
                    p.life -= 0.012;
                    if (p.life <= 0) {
                        sparks.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(Math.round(p.x), Math.round(p.y), size, size);
                }
                ctx.globalAlpha = 1;
                const launching = now - started < shots * 380;
                if (launching || rockets.length || sparks.length) {
                    fireworksFrame = requestAnimationFrame(tick);
                } else {
                    stopFireworks();
                }
            };
            fireworksFrame = requestAnimationFrame(tick);
        }

        function resetApp() {
            stopFireworks();
            resultsScreen.classList.remove('active');
            startScreen.classList.add('active');
            selectedOperation = null;
            mixedQueue = null;
            opState = {};
            pendingRetries = [];
            sessionHistory = [];
            runParts = [];
            awaitingAnswer = false;
        }

        // Compass chose the operations: skip the picker and start the first one.
        if (compassParts && runMode === 'mixed') {
            startMixedPractice();
        } else if (compassParts) {
            selectedOperation = compassParts[0];
            startPractice();
        }
    </script>
</body>
</html>
